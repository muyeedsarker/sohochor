<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b91c1c"><title>SOHOCHOR — Blood Donation</title><style>body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fff5f5,#fff,#f3fff7);margin:0;color:#18352c}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:20px;margin:12px 0;box-shadow:0 6px 20px #0002}.hero{background:linear-gradient(135deg,#b91c1c,#e85d5d,#08783f);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:2px solid #e3b2b2;border-radius:12px;font:inherit}.full{grid-column:1/-1}.btn{padding:11px 15px;border:0;border-radius:999px;background:#b91c1c;color:#fff;font-weight:800}.green{background:#08783f}.donor{border-left:6px solid #b91c1c;padding:13px;margin:10px 0;background:#fff;border-radius:14px;box-shadow:0 3px 12px #0001}.small{font-size:13px;color:#66766f}.home{display:inline-block;margin-bottom:10px;background:#fff;color:#08783f;padding:10px 15px;border-radius:999px;text-decoration:none;font-weight:800;box-shadow:0 4px 12px #0002}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><a class="home" href="index.html">🏠 Home</a><div class="card hero"><h1>🩸 Blood Donation</h1><p>রক্তদাতা খুঁজুন এবং জরুরি রক্তের অনুরোধ জানান।</p></div><div class="card"><h2>🩸 Donor Registration</h2><div class="grid"><input id="name" placeholder="নাম"><select id="group"><option value="">Blood Group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="area" placeholder="এলাকা"><input id="mobile" placeholder="Mobile"><input id="whatsapp" placeholder="WhatsApp"><select id="available"><option>Available</option><option>Unavailable</option></select><input id="last" type="date" title="Last Donation"><button class="btn green full" onclick="addDonor()">💾 Donor Registration</button></div></div><div class="card"><h2>🔎 Blood Search</h2><div class="grid"><select id="filter"><option value="">সব গ্রুপ</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="areaSearch" placeholder="এলাকা দিয়ে খুঁজুন"><button class="btn green full" onclick="render()">🔎 Search</button></div><div id="list"></div></div><div class="card"><h2>🚨 Emergency Request</h2><div class="grid"><input id="patient" placeholder="রোগীর নাম"><select id="egroup"><option value="">রক্তের গ্রুপ</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="hospital" placeholder="হাসপাতাল/স্থান"><input id="contact" placeholder="যোগাযোগ নম্বর"><textarea id="details" class="full" placeholder="জরুরি তথ্য"></textarea><button class="btn full" onclick="requestBlood()">🚨 জরুরি অনুরোধ সংরক্ষণ</button></div><div id="requests"></div></div></main><script>const DK='blood_donors_v2',RK='blood_requests_v2';let donors=JSON.parse(localStorage.getItem(DK)||'[]'),requests=JSON.parse(localStorage.getItem(RK)||'[]');function addDonor(){let d={name:name.value.trim(),group:group.value,area:area.value.trim(),mobile:mobile.value.trim(),whatsapp:whatsapp.value.trim(),available:available.value,last:last.value};if(!d.name||!d.group||!d.area||!d.mobile)return alert('নাম, Blood Group, Area ও Mobile দিন');donors.unshift(d);localStorage.setItem(DK,JSON.stringify(donors));name.value='';group.value='';area.value='';mobile.value='';whatsapp.value='';available.value='Available';last.value='';render()}function render(){let g=filter.value,a=areaSearch.value.trim().toLowerCase();let x=donors.filter(d=>(!g||d.group===g)&&(!a||d.area.toLowerCase().includes(a))&&d.available==='Available');list.innerHTML=x.length?x.map(d=>`<div class="donor"><b>${esc(d.name)}</b> — ${d.group}<br>📍 ${esc(d.area)} · 📱 ${esc(d.mobile)}${d.whatsapp?' · 💬 '+esc(d.whatsapp):''}<br><span class="small">শেষ রক্তদান: ${d.last||'দেওয়া হয়নি'}</span></div>`).join(''):'<p class="small">কোনো available দাতা পাওয়া যায়নি।'}function requestBlood(){let r={patient:patient.value.trim(),group:egroup.value,hospital:hospital.value.trim(),contact:contact.value.trim(),details:details.value.trim(),time:new Date().toLocaleString('bn-BD')};if(!r.patient||!r.group||!r.contact)return alert('রোগীর নাম, রক্তের গ্রুপ ও যোগাযোগ নম্বর দিন');requests.unshift(r);localStorage.setItem(RK,JSON.stringify(requests));patient.value='';egroup.value='';hospital.value='';contact.value='';details.value='';renderRequests()}function renderRequests(){requestsEl.innerHTML=requests.map(r=>`<div class="donor"><b>🚨 ${esc(r.group)} — ${esc(r.patient)}</b><br>${esc(r.hospital)} · ${esc(r.contact)}<br>${esc(r.details)}<br><span class="small">${r.time}</span></div>`).join('')||''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const requestsEl=document.getElementById('requests');render();renderRequests();</script></body></html>
