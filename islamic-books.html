<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>ইসলামী বই — SOHOCHOR</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#183b2b}.wrap{max-width:900px;margin:auto;padding:16px}.head{background:linear-gradient(135deg,#075b3a,#0b7a50);color:white;border-radius:18px;padding:24px;text-align:center}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.actions a{background:#fff;color:#075b3a;padding:11px 16px;border-radius:12px;text-decoration:none;font-weight:800;box-shadow:0 5px 14px #0002}.search{width:100%;box-sizing:border-box;padding:13px;margin:14px 0;border:1px solid #ccd9d0;border-radius:12px;font-size:16px}.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #0000000b}.card h2{margin:0 0 7px;font-size:18px}.author{color:#68736d}.tag{display:inline-block;background:#eef6f1;padding:5px 9px;border-radius:9px;font-size:12px;margin-top:8px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.card-actions a{background:#08783f;color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:700}.card-actions a.order{background:#b77900}.empty{text-align:center;padding:25px;background:white;border-radius:16px}</style></head><body><main class="wrap"><a href="index.html">← হোম</a><section class="head"><h1>📚 ইসলামী বই</h1><p>বিষয়ভিত্তিক বইয়ের তালিকা ও বৈধভাবে বই সংগ্রহের সুবিধা</p><div class="actions"><a href="islamic-books-links.html">🛒 বই দেখুন ও অর্ডার করুন</a><a href="index.html">🏠 SOHOCHOR হোম</a></div></section><input id="q" class="search" placeholder="বই বা লেখক খুঁজুন…"><div id="list"><div class="empty">তালিকা লোড হচ্ছে...</div></div></main><script>const books=[['আল-ফিকহ','আসান ফিকাহ ১ম ও ২য় খন্ড / ফিকহ মুহাম্মদী ১ম ও ২য় খন্ড / ফিকহুস সুন্নাহ ১ম খন্ড','সাইয়্যেদ সাবিক','আল-ফিকহ'],['ঈমান-আক্বীদাহ','তাওহীদ, রিসালাত ও আখিরাত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ঈমান-আক্বীদাহ'],['ঈমান-আক্বীদাহ','আল কুরআনের চারটি মৌলিক পরিভাষা','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ঈমান-আক্বীদাহ'],['ঈমান-আক্বীদাহ','ইসলামী সংস্কৃতির মর্মকথা','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ঈমান-আক্বীদাহ'],['দাওয়াত ও তাবলিগ','সত্যের সাক্ষ্য','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','দাওয়াত ও তাবলিগ'],['দাওয়াত ও তাবলিগ','দাওয়াত ইলাল্লাহ দায়ী ইলাল্লাহ','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','দাওয়াত ও তাবলিগ'],['দাওয়াত ও তাবলিগ','ইসলামী দাওয়াত ও কর্মনীতি','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','দাওয়াত ও তাবলিগ'],['ইসলাম ও ইবাদাত','ইসলামের হাকীকত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','নামাজ রোযার হাকীকত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','যাকাতের হাকীকত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','হজ্জের হাকীকত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','জিহাদের হাকীকত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলাম পরিচিতি','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','শান্তিপথ','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলামের জীবন পদ্ধতি','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলাম ও জাহেলিয়াত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলাম ও আধুনিক অর্থনৈতিক মতবাদ','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলামী অর্থ ব্যবস্থায় যাকাত','ড. জাবেদ মুহাম্মাদ','ইবাদাত'],['ইসলাম ও ইবাদাত','কবীরা গুনাহ (বিআইসি)','ইমাম শামসুদ্দীন আয যাহাবী (রাহি)','ইবাদাত'],['ইসলাম ও ইবাদাত','আর রিবা','ড. মুহাম্মাদ নুরুল ইসলাম','ইবাদাত'],['ইসলাম ও ইবাদাত','ইসলাম ও জাহেলিয়াতের চিরন্তন দ্বন্দ্ব','আব্বাস আলী খান (রাহ.)','ইবাদাত'],['আমল-আখলাক ও মু\'আমালাত','আল্লাহর নৈকট্য লাভের উপায়','মাওলানা মতিউর রহমান নিজামী (রাহি)','আমল-আখলাক'],['আমল-আখলাক ও মু\'আমালাত','চরিত্র গঠনের মৌলিক উপাদান','নঈম সিদ্দিকী (রাহি)','আমল-আখলাক'],['আমল-আখলাক ও মু\'আমালাত','ইসলামী আদাবে জিন্দেগী','মাওলানা মতিউর রহমান নিজামী (রাহি)','আমল-আখলাক'],['ইসলামী আন্দোলন ও সংগঠন','জামায়াতে ইসলামীর কার্যবিবরণী ১ম ও ২য় খন্ড','বাংলাদেশ জামায়াতে ইসলামী','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','গঠনতন্ত্র, বাংলাদেশ জামায়াতে ইসলামী','বাংলাদেশ জামায়াতে ইসলামী','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','সংগঠন পদ্ধতি, বাংলাদেশ জামায়াতে ইসলামী','বাংলাদেশ জামায়াতে ইসলামী','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','ইসলামী আন্দোলন : সাফল্যের শর্তাবলী','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','হেদায়াত','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','ইসলামী রেনেসাঁ আন্দোলন','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','আন্দোলন ও সংগঠন'],['ইসলামী আন্দোলন ও সংগঠন','ইসলামী আন্দোলনের ভবিষ্যত কর্মসূচি','সাইয়েদ আবুল আ\'লা মওদূদী (রাহি)','আন্দোলন ও সংগঠন']];const list=document.getElementById('list');function render(){const q=document.getElementById('q').value.trim().toLowerCase();const a=books.filter(x=>x.join(' ').toLowerCase().includes(q));list.innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">${x[3]}</span><h2>${x[1]}</h2><div class="author">লেখক: ${x[2]}</div><div class="card-actions"><a href="islamic-books-links.html">📖 বিস্তারিত</a><a class="order" href="islamic-books-links.html">🛒 অর্ডার করুন</a></div></article>`).join(''):'<div class="empty">কোনো বই পাওয়া যায়নি।</div>'}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
