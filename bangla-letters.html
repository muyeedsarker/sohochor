<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>বাংলা অক্ষর শিখি 🎈</title>
<style>
:root{--a:#ff6b6b;--b:#4ecdc4;--c:#ffb347;--d:#a66bff;--e:#ff8ecf;--text:#333}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Bengali','Segoe UI',sans-serif;background:linear-gradient(135deg,#ffe6f0,#fff3d6,#e6fff2,#e6f2ff,#f3e6ff);background-size:300% 300%;animation:bg 18s ease infinite;color:var(--text);padding:20px}@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}header{text-align:center;margin-bottom:20px}h1{font-size:clamp(2rem,7vw,2.8rem);color:var(--a);margin:0 0 6px;text-shadow:2px 2px #fff}header p{font-size:1.05rem;color:#555;margin:0;line-height:1.7}.home{display:inline-flex;margin:0 auto 14px;padding:10px 17px;border-radius:999px;background:linear-gradient(135deg,#ff6b6b,#ffb347);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 5px 0 #d84c70}.section-title{text-align:center;color:var(--c);font-size:1.6em;margin:28px 0 14px;text-shadow:1px 1px #fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px;max-width:1100px;margin:0 auto}.card{width:100%;background:#fff;border-radius:20px;padding:15px;text-align:center;box-shadow:0 4px 10px #0000001a;transition:transform .15s,box-shadow .15s;border:4px solid var(--x);cursor:pointer;font-family:inherit}.card:nth-child(5n+1){--x:var(--a)}.card:nth-child(5n+2){--x:var(--b)}.card:nth-child(5n+3){--x:var(--c)}.card:nth-child(5n+4){--x:var(--d)}.card:nth-child(5n+5){--x:var(--e)}.card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 22px #0003}.card:active,.card.active{transform:translateY(3px) scale(.98);box-shadow:0 2px 6px #0002}.emoji{font-size:2.5em;margin-bottom:5px}.letter{font-size:2.2em;font-weight:900;color:var(--a);line-height:1}.english{font-size:1.08em;color:var(--b);font-weight:800;margin:5px 0}.word{font-size:.95em;color:#555}.listen{display:inline-block;margin-top:8px;font-size:.82em;font-weight:800;color:var(--d)}footer{text-align:center;margin-top:30px;color:#888;font-size:.9em}.hint{text-align:center;margin:10px auto 0;font-weight:800;color:#7048d6}button{appearance:none}
</style></head>
<body>
<main>
<a class="home" href="children.html">🏠 শিশু কর্নারে ফিরে যান</a>
<header><h1>🎈 বাংলা অক্ষর শিখি 🎈</h1><p>প্রতিটা অক্ষরে ইমোজি, ইংরেজি বানান আর একটি শব্দ আছে — মজা করে শেখো!</p><div class="hint">🔊 অক্ষর বা কার্ডে চাপ দিলে উচ্চারণ শোনা যাবে</div></header>
<h2 class="section-title">🌈 স্বরবর্ণ</h2><div class="grid" id="vowelGrid"></div>
<h2 class="section-title">🌟 ব্যঞ্জনবর্ণ</h2><div class="grid" id="consonantGrid"></div>
<h2 class="section-title">✨ বিশেষ চিহ্ন</h2><div class="grid" id="specialGrid"></div>
<footer>তৈরি করা হয়েছে ছোট্ট বন্ধুদের জন্য 💛</footer>
</main>
<script>
const vowels=[{bn:'অ',en:'O',emoji:'🐍',word:'অজগর'},{bn:'আ',en:'A',emoji:'🥭',word:'আম'},{bn:'ই',en:'I',emoji:'🐭',word:'ইঁদুর'},{bn:'ঈ',en:'EE',emoji:'🦅',word:'ঈগল'},{bn:'উ',en:'U',emoji:'🐫',word:'উট'},{bn:'ঊ',en:'OO',emoji:'🌅',word:'ঊষা'},{bn:'ঋ',en:'RI',emoji:'🧙',word:'ঋষি'},{bn:'এ',en:'E',emoji:'🌿',word:'এলাচ'},{bn:'ঐ',en:'OI',emoji:'🐘',word:'ঐরাবত'},{bn:'ও',en:'O',emoji:'🥔',word:'ওল'},{bn:'ঔ',en:'OU',emoji:'💊',word:'ঔষধ'}];
const consonants=[{bn:'ক',en:'K',emoji:'✏️',word:'কলম'},{bn:'খ',en:'KH',emoji:'🐰',word:'খরগোশ'},{bn:'গ',en:'G',emoji:'🐄',word:'গরু'},{bn:'ঘ',en:'GH',emoji:'⌚',word:'ঘড়ি'},{bn:'ঙ',en:'NG',emoji:'🎨',word:'রং'},{bn:'চ',en:'CH',emoji:'🌙',word:'চাঁদ'},{bn:'ছ',en:'CHH',emoji:'☂️',word:'ছাতা'},{bn:'জ',en:'J',emoji:'🚢',word:'জাহাজ'},{bn:'ঝ',en:'JH',emoji:'🧺',word:'ঝুড়ি'},{bn:'ঞ',en:'NYO',emoji:'🔤',word:'বর্ণ ঞ'},{bn:'ট',en:'T',emoji:'🍅',word:'টমেটো'},{bn:'ঠ',en:'TH',emoji:'👵',word:'ঠাকুরমা'},{bn:'ড',en:'D',emoji:'🥚',word:'ডিম'},{bn:'ঢ',en:'DH',emoji:'🥁',word:'ঢোল'},{bn:'ণ',en:'N',emoji:'🏹',word:'বাণ'},{bn:'ত',en:'T',emoji:'🍉',word:'তরমুজ'},{bn:'থ',en:'TH',emoji:'🍽️',word:'থালা'},{bn:'দ',en:'D',emoji:'🥣',word:'দই'},{bn:'ধ',en:'DH',emoji:'🌾',word:'ধান'},{bn:'ন',en:'N',emoji:'🏞️',word:'নদী'},{bn:'প',en:'P',emoji:'🐦',word:'পাখি'},{bn:'ফ',en:'PH',emoji:'🌸',word:'ফুল'},{bn:'ব',en:'B',emoji:'⚽',word:'বল'},{bn:'ভ',en:'BH',emoji:'🐻',word:'ভালুক'},{bn:'ম',en:'M',emoji:'🐟',word:'মাছ'},{bn:'য',en:'J/Z',emoji:'🧙‍♂️',word:'যাদুকর'},{bn:'র',en:'R',emoji:'👑',word:'রাজা'},{bn:'ল',en:'L',emoji:'🥒',word:'লাউ'},{bn:'শ',en:'SH',emoji:'🦊',word:'শিয়াল'},{bn:'ষ',en:'SH',emoji:'🐂',word:'ষাঁড়'},{bn:'স',en:'S',emoji:'☀️',word:'সূর্য'},{bn:'হ',en:'H',emoji:'🐘',word:'হাতি'},{bn:'ড়',en:'R',emoji:'⛰️',word:'পাহাড়'},{bn:'ঢ়',en:'RH',emoji:'🌊',word:'গাঢ়'},{bn:'য়',en:'Y',emoji:'🍞',word:'খায়'}];
const specials=[{bn:'ৎ',en:'T (khanda ta)',emoji:'💥',word:'হঠাৎ'},{bn:'ং',en:'NG (anusvara)',emoji:'🌈',word:'রঙিন'},{bn:'ঃ',en:'H (visarga)',emoji:'😢',word:'দুঃখ'},{bn:'ঁ',en:'chandrabindu',emoji:'🦆',word:'হাঁস'}];
function speak(text){if(!('speechSynthesis'in window)){alert('এই ডিভাইসে উচ্চারণ সুবিধা নেই।');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=.75;u.pitch=1.1;speechSynthesis.speak(u)}
function fillGrid(id,data){const grid=document.getElementById(id);data.forEach(item=>{const card=document.createElement('button');card.type='button';card.className='card';card.setAttribute('aria-label',item.bn+' '+item.word+' উচ্চারণ শুনুন');card.innerHTML=`<div class="emoji">${item.emoji}</div><div class="letter">${item.bn}</div><div class="english">${item.en}</div><div class="word">${item.word}</div><div class="listen">🔊 শুনুন</div>`;card.addEventListener('click',()=>{document.querySelectorAll('.card.active').forEach(x=>x.classList.remove('active'));card.classList.add('active');speak(item.bn+'। '+item.word);setTimeout(()=>card.classList.remove('active'),700)});grid.appendChild(card)})}
fillGrid('vowelGrid',vowels);fillGrid('consonantGrid',consonants);fillGrid('specialGrid',specials);
</script></body></html>
