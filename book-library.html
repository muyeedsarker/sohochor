<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR — Islamic Book Library</title><style>body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #0002}.hero{background:linear-gradient(135deg,#08783f,#1261a0,#7b3fc7);color:#fff}.home{display:inline-block;background:#fff;color:#08783f;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:800;margin-bottom:10px}.filters{display:grid;grid-template-columns:1fr 180px;gap:10px}@media(max-width:560px){.filters{grid-template-columns:1fr}}input,select{width:100%;box-sizing:border-box;padding:12px;border:2px solid #b7d9c8;border-radius:12px;font-size:16px}.book{background:#fff;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 4px 15px #0002;border-left:6px solid #08783f}.tag{display:inline-block;background:#e4f5eb;color:#08783f;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{border:0;border-radius:10px;padding:8px 11px;text-decoration:none;font-weight:800;cursor:pointer}.read{background:#dff3ff;color:#1261a0}.mark{background:#fff0b8;color:#7b5a00}.marked{background:#ffe08a}.empty{text-align:center;color:#68756e;padding:20px}</style></head><body><main class="wrap"><a class="home" href="index.html">🏠 Home</a><section class="hero"><h1>📚 ইসলামি বই</h1><p>বৈধভাবে ব্যবহারের অনুমতিপ্রাপ্ত ও Public Domain বইয়ের লাইব্রেরি।</p></section><section class="card"><div class="filters"><input id="search" placeholder="🔎 বই/লেখক খুঁজুন..." oninput="render()"><select id="cat" onchange="render()"><option value="">সব Category</option><option>কুরআন</option><option>হাদিস</option><option>দোয়া</option><option>ইসলামি জ্ঞান</option><option>শিশু শিক্ষা</option></select></div></section><section id="books"></section></main><script>const books=[{id:1,title:'কুরআন ও ইসলামি জ্ঞান',author:'SOHOCHOR সংগ্রহ',category:'কুরআন',description:'কুরআন ও মৌলিক ইসলামি জ্ঞান শেখার জন্য নির্বাচিত বৈধ রিসোর্স।',url:'',pdf:''},{id:2,title:'দৈনন্দিন দোয়া',author:'SOHOCHOR সংগ্রহ',category:'দোয়া',description:'দৈনন্দিন জীবনের প্রয়োজনীয় দোয়ার সংগ্রহ।',url:'',pdf:''},{id:3,title:'শিশুদের ইসলামি শিক্ষা',author:'SOHOCHOR সংগ্রহ',category:'শিশু শিক্ষা',description:'শিশুদের জন্য সহজ ইসলামি শিক্ষা ও অনুশীলন।',url:'',pdf:''}];let saved=JSON.parse(localStorage.getItem('sohochor_bookmarks')||'[]');function render(){const t=search.value.trim().toLowerCase(),c=cat.value;const x=books.filter(b=>(!t||`${b.title} ${b.author} ${b.description}`.toLowerCase().includes(t))&&(!c||b.category===c));booksEl.innerHTML=x.length?x.map(b=>`<article class="book"><span class="tag">${b.category}</span><h2>${esc(b.title)}</h2><b>✍️ ${esc(b.author)}</b><p>${esc(b.description)}</p><div class="actions">${b.url?`<a class="read" href="${esc(b.url)}" target="_blank" rel="noopener">📖 পড়ুন</a>`:''}${b.pdf?`<a class="read" href="${esc(b.pdf)}" target="_blank" rel="noopener">📄 PDF</a>`:''}<button class="mark ${saved.includes(b.id)?'marked':''}" onclick="bookmark(${b.id})">${saved.includes(b.id)?'🔖 Bookmarked':'🔖 Bookmark'}</button></div></article>`).join(''):'<div class="card empty">কোনো বই পাওয়া যায়নি। বৈধ PDF/লিংক যোগ হলে এখান থেকেই খোলা যাবে।'}function bookmark(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('sohochor_bookmarks',JSON.stringify(saved));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const booksEl=document.getElementById('books');render();</script></body></html>
