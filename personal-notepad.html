<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>Personal Notepad — SOHOCHOR</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#183b2b;margin:0}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea{font:inherit;padding:11px;border:1px solid #bccac1;border-radius:9px;box-sizing:border-box;width:100%}textarea{min-height:180px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#08783f;color:#fff;font-weight:700}.danger{background:#a22}.note{border-top:1px solid #ddd;padding:12px 0}.note h3{margin:0}.small{color:#68736d;font-size:13px}@media(max-width:600px){.row .btn{flex:1}}</style></head><body><main class="wrap"><a href="index.html">← হোম</a><div class="card"><h1>📝 Personal Notepad</h1><p class="small">নোটগুলো এই ডিভাইসের ব্রাউজারেই সংরক্ষিত থাকবে।</p><input id="title" placeholder="নোটের শিরোনাম"><br><br><textarea id="body" placeholder="আপনার নোট লিখুন..."></textarea><br><br><div class="row"><button class="btn" onclick="save()">💾 Save</button><button class="btn" onclick="clearForm()">✏️ নতুন</button></div></div><div class="card"><input id="search" placeholder="🔎 নোট Search" oninput="render()"><div id="notes"></div></div></main><script>const KEY='sohochor_personal_notes_v1';let notes=JSON.parse(localStorage.getItem(KEY)||'[]'),editId=null;function save(){let title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim();if(!title&&!body)return alert('নোট লিখুন');if(editId){let n=notes.find(x=>x.id===editId);n.title=title;n.body=body;n.updated=Date.now()}else notes.unshift({id:Date.now(),title,body,updated:Date.now()});localStorage.setItem(KEY,JSON.stringify(notes));clearForm();render()}function edit(id){let n=notes.find(x=>x.id===id);editId=id;title.value=n.title;body.value=n.body;scrollTo({top:0,behavior:'smooth'})}function del(id){if(confirm('এই নোটটি মুছে ফেলবেন?')){notes=notes.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(notes));render()}}function clearForm(){editId=null;title.value='';body.value=''}function render(){let q=search.value.toLowerCase();let a=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));notesEl.innerHTML=a.length?a.map(n=>`<article class="note"><h3>${esc(n.title)}</h3><p>${esc(n.body).replace(/\n/g,'<br>')}</p><div class="small">${new Date(n.updated).toLocaleString('bn-BD')}</div><br><button class="btn" onclick="edit(${n.id})">Edit</button> <button class="btn danger" onclick="del(${n.id})">Delete</button></article>`).join(''):'<p class="small">কোনো নোট নেই।</p>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const notesEl=document.getElementById('notes');render();</script></body></html>
