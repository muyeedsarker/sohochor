<!doctype html><html lang="bn-BD"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR • HADITH</title><style>:root{--g:#08783f;--gd:#075b31;--gold:#d7a72a;--ink:#18342a;--muted:#64756d;--line:#dce9e1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef8f2,#f8fbf9);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.brand{font-weight:900;color:var(--g);letter-spacing:.08em}.home{color:var(--g);text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:26px;padding:28px 22px;box-shadow:0 18px 45px #075b3124}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;line-height:1.8}.tools{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin:18px 0}.tools input,.tools select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:999px;padding:9px 14px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:var(--g);color:#fff}.count{color:var(--muted);font-weight:800;margin:8px 14px}.hadith{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 10px 28px #1745320c}.meta{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#edf7f0;color:var(--g);border-radius:999px;padding:5px 9px;font-size:13px;font-weight:800}.gold{background:#fff7dd;color:#876300}.hadith h2{margin:12px 0 8px}.arabic{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Amiri",serif;font-size:25px;line-height:2.1;background:#fbfaf3;border-right:4px solid var(--gold);padding:14px 16px;border-radius:14px;margin:12px 0}.bn{font-size:17px;line-height:1.95}.source{color:#52665d;font-size:14px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a,.actions button{border:0;border-radius:12px;padding:9px 13px;background:#edf7f0;color:var(--g);font-weight:800;text-decoration:none;cursor:pointer}.actions button.saved{background:#fff1bd;color:#725500}.notice{background:#fffdf4;border:1px solid #ead99c;border-radius:18px;padding:16px;line-height:1.8;color:#5f531f;margin-top:18px}.empty{text-align:center;background:#fff;border:1px dashed #b8cfc2;border-radius:20px;padding:35px;color:var(--muted)}@media(max-width:760px){.tools{grid-template-columns:1fr}.wrap{padding:12px}.hero{border-radius:22px}.hadith{padding:16px}.arabic{font-size:22px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">SOHOCHOR • HADITH</div><a class="home" href="islam.html">← ইসলাম শিক্ষা</a></header><section class="hero"><h1>📚 হাদিস শিক্ষা</h1><p>বিষয়ভিত্তিক হাদিস পড়ুন, আরবি ও বাংলা অনুবাদ দেখুন এবং গ্রন্থ ও হাদিস নম্বরসহ উৎস যাচাই করুন।</p></section><section class="tools"><input id="search" type="search" placeholder="🔎 হাদিস, বিষয় বা উৎস খুঁজুন…"><select id="book"><option value="all">📚 সব গ্রন্থ</option><option>সহিহ বুখারি</option><option>সহিহ মুসলিম</option></select><select id="topic"><option value="all">🏷️ সব বিষয়</option><option value="niyat">🌿 নিয়ত</option><option value="akhlaq">❤️ উত্তম চরিত্র</option><option value="family">👨‍👩‍👧 পরিবার</option><option value="ibadah">🕌 ইবাদত</option></select></section><nav class="tabs"><button class="tab active" data-topic="all">সব হাদিস</button><button class="tab" data-topic="niyat">🌿 নিয়ত</button><button class="tab" data-topic="akhlaq">❤️ চরিত্র</button><button class="tab" data-topic="family">👨‍👩‍👧 পরিবার</button><button class="tab" data-topic="ibadah">🕌 ইবাদত</button></nav><div id="count" class="count"></div><section id="list"></section><div class="notice"><b>⚠️ উৎস নীতি:</b> এখানে প্রকাশিত হাদিসের সঙ্গে গ্রন্থের নাম ও নম্বর দেখানো হচ্ছে। যাচাই ছাড়া কোনো বর্ণনাকে সহিহ বলা হবে না।</div></main><script>const hadiths=[{id:1,topic:'niyat',book:'সহিহ বুখারি',no:'1',title:'কাজ নিয়তের উপর নির্ভরশীল',arabic:'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى',bn:'নিশ্চয়ই কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তার নিয়ত অনুযায়ী ফল পাবে।',grade:'সহিহ',source:'সহিহ বুখারি ১',url:'https://sunnah.com/bukhari:1'},{id:2,topic:'akhlaq',book:'সহিহ বুখারি',no:'6029',title:'উত্তম চরিত্রের মর্যাদা',arabic:'خِيَارُكُمْ أَحَاسِنُكُمْ أَخْلَاقًا',bn:'তোমাদের মধ্যে উত্তম সেই ব্যক্তি, যার চরিত্র উত্তম।',grade:'সহিহ',source:'সহিহ বুখারি ৬০২৯',url:'https://sunnah.com/bukhari:6029'},{id:3,topic:'family',book:'সহিহ বুখারি',no:'5185',title:'পরিবারের প্রতি দায়িত্ব',arabic:'كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ',bn:'তোমরা প্রত্যেকেই দায়িত্বশীল এবং প্রত্যেককে তার দায়িত্ব সম্পর্কে জিজ্ঞাসা করা হবে।',grade:'সহিহ',source:'সহিহ বুখারি ৫১৮৫',url:'https://sunnah.com/bukhari:5185'},{id:4,topic:'ibadah',book:'সহিহ বুখারি',no:'8',title:'ইসলামের পাঁচ ভিত্তি',arabic:'بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ',bn:'ইসলাম পাঁচটি ভিত্তির ওপর প্রতিষ্ঠিত।',grade:'সহিহ',source:'সহিহ বুখারি ৮',url:'https://sunnah.com/bukhari:8'},{id:5,topic:'ibadah',book:'সহিহ মুসলিম',no:'223',title:'পবিত্রতা ও ঈমান',arabic:'الطُّهُورُ شَطْرُ الإِيمَانِ',bn:'পবিত্রতা ঈমানের অর্ধেক।',grade:'সহিহ',source:'সহিহ মুসলিম ২২৩',url:'https://sunnah.com/muslim:223'},{id:6,topic:'akhlaq',book:'সহিহ মুসলিম',no:'2564',title:'মুমিনের প্রতি মুমিনের দায়িত্ব',arabic:'لاَ تَحَاسَدُوا وَلاَ تَبَاغَضُوا وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا',bn:'তোমরা পরস্পর হিংসা ও বিদ্বেষ করো না; আল্লাহর বান্দা হিসেবে ভাই ভাই হয়ে থাকো।',grade:'সহিহ',source:'সহিহ মুসলিম ২৫৬৪',url:'https://sunnah.com/muslim:2564'}];let state={topic:'all',book:'all',q:''},saved=JSON.parse(localStorage.getItem('sohochorHadithSaved')||'[]');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const q=state.q.toLowerCase();const rows=hadiths.filter(h=>(state.topic==='all'||h.topic===state.topic)&&(state.book==='all'||h.book===state.book)&&(!q||[h.title,h.bn,h.book,h.source].join(' ').toLowerCase().includes(q)));count.textContent=`${rows.length}টি যাচাইকৃত নমুনা হাদিস দেখানো হচ্ছে`;list.innerHTML=rows.length?rows.map(h=>`<article class="hadith"><div class="meta"><span class="badge">${h.book}</span><span class="badge gold">${h.grade}</span><span class="badge">হাদিস ${h.no}</span></div><h2>${esc(h.title)}</h2><div class="arabic">${esc(h.arabic)}</div><div class="bn">${esc(h.bn)}</div><div class="source">📚 উৎস: <b>${esc(h.source)}</b></div><div class="actions"><button class="save ${saved.includes(h.id)?'saved':''}" data-id="${h.id}">${saved.includes(h.id)?'★ সংরক্ষিত':'☆ সংরক্ষণ'}</button><a href="${h.url}" target="_blank" rel="noopener">🔎 উৎস যাচাই</a></div></article>`).join(''):'<div class="empty">কোনো হাদিস পাওয়া যায়নি। অন্য বিষয় বা শব্দ দিয়ে চেষ্টা করুন।</div>';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id);saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('sohochorHadithSaved',JSON.stringify(saved));render()})}search.oninput=e=>{state.q=e.target.value;render()};book.onchange=e=>{state.book=e.target.value;render()};topic.onchange=e=>{state.topic=e.target.value;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.topic===state.topic));render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;topic.value=state.topic;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script></body></html>
