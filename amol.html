<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOHOCHOR — আমার আমল</title><link rel="stylesheet" href="theme.css?v=6"><style>.item{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 18px #0001;display:flex;align-items:center;justify-content:space-between}.btn{border:0;border-radius:12px;padding:10px 14px;background:#08783f;color:#fff;font-weight:800}.count{font-size:22px;font-weight:900;color:#08783f}</style></head><body><main class="page"><a class="back" href="personal.html">← Personal Space</a><section class="hero"><div class="hero-kicker">SOHOCHOR — সহচর</div><h1>📿 আমার আমল</h1><p>নিজের দৈনিক আমল ট্র্যাক করুন। তথ্য এই ডিভাইসের Local Storage-এ থাকে।</p></section><section id="list"></section><a class="back" href="index.html">🏠 Home</a></main><script>const key='sohochor_amol';let data=JSON.parse(localStorage.getItem(key)||'{}');const acts=['সালাত','কুরআন পাঠ','দোয়া','যিকির'];function render(){list.innerHTML=acts.map((a,i)=>`<div class="item"><b>${a}</b><span class="count">${data[i]||0}</span><button class="btn" onclick="add(${i})">+ ১</button></div>`).join('')}function add(i){data[i]=(data[i]||0)+1;localStorage.setItem(key,JSON.stringify(data));render()}render();</script></body></html>
