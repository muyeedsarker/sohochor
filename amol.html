<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOHOCHOR — আমার আমল</title><link rel="stylesheet" href="theme.css?v=6"><style>.item{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 18px #0001;display:flex;align-items:center;justify-content:space-between}.btn{border:0;border-radius:12px;padding:10px 14px;background:#08783f;color:#fff;font-weight:800}.count{font-size:22px;font-weight:900;color:#08783f}.status{margin:10px 0;padding:10px;border-radius:12px;background:#f3faf6}</style></head><body><main class="page"><a class="back" href="personal.html">← Personal Space</a><section class="hero"><div class="hero-kicker">SOHOCHOR — সহচর</div><h1>📿 আমার আমল</h1><p>নিজের দৈনিক আমল ট্র্যাক করুন। আপনার অ্যাকাউন্টে সংরক্ষিত থাকে।</p></section><div id="status" class="status">লোড হচ্ছে…</div><section id="list"></section><a class="back" href="index.html">🏠 Home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');const acts=['সালাত','কুরআন পাঠ','দোয়া','যিকির'];let user=null;let data={};const statusEl=document.getElementById('status');const listEl=document.getElementById('list');function render(){listEl.innerHTML=acts.map((a,i)=>`<div class="item"><b>${a}</b><span class="count">${data[a]||0}</span><button class="btn" onclick="add(${i})">+ ১</button></div>`).join('')}async function load(){const {data:sessionData}=await db.auth.getSession();user=sessionData.session?.user||null;if(!user){statusEl.textContent='দৈনিক আমল সংরক্ষণ করতে আগে Login করুন।';render();return}const {data:rows,error}=await db.from('amol_entries').select('activity,count').eq('user_id',user.id);if(error){statusEl.textContent='আমল লোড করা যায়নি। আবার চেষ্টা করুন।';render();return}data={};(rows||[]).forEach(r=>data[r.activity]=r.count);statusEl.textContent='আপনার আমল অ্যাকাউন্টে সংরক্ষিত হচ্ছে।';render()}async function add(i){if(!user){statusEl.textContent='আমল সংরক্ষণ করতে Login করুন।';return}const activity=acts[i];const next=(data[activity]||0)+1;const {error}=await db.from('amol_entries').upsert({user_id:user.id,activity,count:next,updated_at:new Date().toISOString()},{onConflict:'user_id,activity'});if(error){statusEl.textContent='সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।';return}data[activity]=next;statusEl.textContent='সংরক্ষণ হয়েছে ✓';render()}load();</script></body></html>
