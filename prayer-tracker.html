<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>নামাজ ট্র্যাকার — SOHOCHOR</title><style>body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4faf7;color:#17382b}.wrap{max-width:700px;margin:auto;padding:18px 14px 70px}.top{display:flex;justify-content:space-between}.btn{background:#087a4a;color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:900}.hero{margin-top:14px;background:linear-gradient(135deg,#063b27,#0b8150);color:#fff;border-radius:24px;padding:24px}.card{margin-top:14px;background:#fff;border:1px solid #dbe9e1;border-radius:20px;padding:18px;box-shadow:0 8px 24px #17382b0b}.row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:13px;background:#f5faf7;margin:8px 0}.row input{width:22px;height:22px;accent-color:#087a4a}.stats{text-align:center;font-size:30px;font-weight:1000;color:#087a4a}.reset{margin-top:10px;border:0;background:#eef5f1;color:#087a4a;padding:10px 14px;border-radius:10px;font-weight:800}@media(max-width:480px){.row{padding:11px}}</style></head><body><main class="wrap"><div class="top"><a class="btn" href="index.html">🏠 হোম</a><a class="btn" href="prayer.html">🕌 নামাজ</a></div><section class="hero"><h1>🕌 নামাজ ট্র্যাকার</h1><p id="date"></p><p>আজকের পাঁচ ওয়াক্ত নামাজ আদায়ের ব্যক্তিগত অগ্রগতি নোট করুন।</p></section><section class="card"><div id="stats" class="stats">0 / 5</div><div id="rows"></div><button class="reset" onclick="resetDay()">আজকের তালিকা রিসেট</button></section></main><script>const names=['ফজর','যোহর','আসর','মাগরিব','এশা'];const key='sohochor-prayer-'+new Date().toISOString().slice(0,10);let state=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('date').textContent=new Intl.DateTimeFormat('bn-BD',{dateStyle:'full'}).format(new Date());function render(){document.getElementById('rows').innerHTML=names.map((n,i)=>`<label class="row"><span>🕌 ${n}</span><input type="checkbox" ${state[i]?'checked':''} onchange="toggle(${i},this.checked)"></label>`).join('');document.getElementById('stats').textContent=`${state.filter(Boolean).length} / 5`; }function toggle(i,v){state[i]=v;localStorage.setItem(key,JSON.stringify(state));render()}function resetDay(){state=[];localStorage.removeItem(key);render()}render();</script></body></html>
