const list=document.getElementById('list'),library=document.getElementById('library'),reader=document.getElementById('reader'),title=document.getElementById('title'),verses=document.getElementById('verses');function render(q=''){const z=q.toLowerCase();list.innerHTML=surahs.filter(s=>s[1].toLowerCase().includes(z)||s[0].includes(z)).map((s,i)=>`<a class="surah" href="#surah-${i+1}" data-id="${i+1}"><span class="num">${s[0]}</span><b>${s[1]}</b><span class="meta">${s[2]} আয়াত ›</span></a>`).join('')||'<p>কোনো সূরা পাওয়া যায়নি।</p>'}async function openSurah(id){const s=surahs[id-1];if(!s)return;history.pushState({id},'',`#surah-${id}`);library.style.display='none';reader.classList.add('show');title.innerHTML=`<h2>সূরা ${s[1]}</h2><p class="small">${s[2]} আয়াত</p>`;verses.innerHTML='<div class="loading">📖 সূরা লোড হচ্ছে…</div>';try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,bn.bengali`);if(!r.ok)throw new Error('API error');const j=await r.json();const ar=j.data.find(x=>x.edition.identifier==='quran-uthmani');const bn=j.data.find(x=>x.edition.identifier==='bn.bengali');if(!ar)throw new Error('Arabic edition missing');verses.innerHTML=ar.ayahs.map((a,k)=>`<article class="ayah"><div class="arabic">${a.text} <small>﴿${a.numberInSurah}﴾</small></div>${bn&&bn.ayahs[k]?`<div class="trans">${bn.ayahs[k].text}</div>`:''}</article>`).join('')}catch(e){verses.innerHTML='<div class="err">সূরাটি এখন লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</div>'}}list.addEventListener('click',e=>{const a=e.target.closest('.surah');if(a){e.preventDefault();openSurah(Number(a.dataset.id))}});document.getElementById('search').addEventListener('input',e=>render(e.target.value.trim()));document.getElementById('back').onclick=()=>{reader.classList.remove('show');library.style.display='block';history.pushState({},'',location.pathname)};window.addEventListener('popstate',()=>{const m=location.hash.match(/surah-(\d+)/);if(m)openSurah(Number(m[1]));else{reader.classList.remove('show');library.style.display='block'}});render();if(location.hash){const m=location.hash.match(/surah-(\d+)/);if(m)openSurah(Number(m[1]))}
(function(){const root=document.getElementById('sohochorMedia'),main=document.getElementById('mediaMain'),menu=document.getElementById('mediaMenu'),audio=document.getElementById('mediaAudio'),mediaTitle=document.getElementById('mediaTitle'),close=document.getElementById('mediaClose');const KEY='sohochorMediaPosition';const sources={quran:{label:'কুরআন তেলাওয়াত',url:'https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/1.mp3'},waz:{label:'ওয়াজ',url:''},ghazal:{label:'গজল',url:''},azan:{label:'আযান',url:'https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Adhan_Ajman_UAE_%28%D8%A3%D8%B0%D8%A7%D9%86_%D8%B9%D8%AC%D9%85%D8%A7%D9%86_%D8%A7%D9%84%D8%A5%D9%85%D8%A7%D8%B1%D8%A7%D8%AA%29.mp3'},song:{label:'ইসলামি গান',url:''}};function clamp(){const r=root.getBoundingClientRect();const maxX=Math.max(6,innerWidth-r.width-6),maxY=Math.max(6,innerHeight-r.height-6);let x=parseFloat(root.dataset.x),y=parseFloat(root.dataset.y);if(!Number.isFinite(x)||!Number.isFinite(y)){x=innerWidth-r.width-18;y=innerHeight-r.height-92}x=Math.min(Math.max(6,x),maxX);y=Math.min(Math.max(6,y),maxY);root.style.left=x+'px';root.style.top=y+'px';root.style.right='auto';root.style.bottom='auto';root.dataset.x=x;root.dataset.y=y}function save(){localStorage.setItem(KEY,JSON.stringify({x:Number(root.dataset.x),y:Number(root.dataset.y)}))}function restore(){try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p){root.dataset.x=p.x;root.dataset.y=p.y}}catch(e){}clamp()}restore();addEventListener('resize',clamp);let dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0;function point(e){const t=e.touches&&e.touches[0];return{x:t?t.clientX:e.clientX,y:t?t.clientY:e.clientY}}function down(e){const p=point(e),r=root.getBoundingClientRect();startX=p.x;startY=p.y;startLeft=r.left;startTop=r.top;dragging=true;moved=false;root.classList.add('is-dragging');e.preventDefault()}function move(e){if(!dragging)return;const p=point(e),dx=p.x-startX,dy=p.y-startY;if(Math.hypot(dx,dy)>5)moved=true;const r=root.getBoundingClientRect(),maxX=Math.max(6,innerWidth-r.width-6),maxY=Math.max(6,innerHeight-r.height-6),x=Math.min(Math.max(6,startLeft+dx),maxX),y=Math.min(Math.max(6,startTop+dy),maxY);root.style.left=x+'px';root.style.top=y+'px';root.style.right='auto';root.style.bottom='auto';root.dataset.x=x;root.dataset.y=y;e.preventDefault()}function up(){if(!dragging)return;dragging=false;root.classList.remove('is-dragging');save();if(!moved){const open=root.classList.toggle('open');main.setAttribute('aria-expanded',open?'true':'false');menu.setAttribute('aria-hidden',open?'false':'true')}}main.addEventListener('mousedown',down);document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);main.addEventListener('touchstart',down,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);document.querySelectorAll('[data-media]').forEach(btn=>btn.addEventListener('click',()=>{const item=sources[btn.dataset.media];if(!item)return;if(!item.url){mediaTitle.textContent=item.label+' — অডিও সোর্স পরে যোগ করা যাবে';audio.removeAttribute('src');audio.load();root.classList.add('has-player');return}audio.pause();audio.src=item.url;mediaTitle.textContent=item.label;root.classList.add('has-player');audio.play().catch(()=>{});root.classList.remove('open');main.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}));close.addEventListener('click',()=>{audio.pause();audio.removeAttribute('src');audio.load();root.classList.remove('has-player')})})()</script></body></html>
