<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>কুরআন — SOHOCHOR</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:linear-gradient(180deg,#eef8f2,#fff);color:#17382b}.wrap{max-width:980px;margin:auto;padding:14px}.top{background:#063b27;color:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 28px #063b2733}.top h1{margin:0 0 6px}.back,.btn{display:inline-block;text-decoration:none;font-weight:900;border-radius:14px;padding:11px 16px}.back{background:#fff;color:#087a4a;margin-bottom:12px}.box{background:#fff;border:1px solid #dcebe2;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #173d2c0b}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d5e4dc;border-radius:14px;font-size:16px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.surah{display:flex;align-items:center;gap:10px;text-decoration:none;color:#17382b;background:linear-gradient(145deg,#fff,#f1f8f4);border:1px solid #d7e7de;border-radius:16px;padding:14px;box-shadow:5px 7px 14px #173d2c12;transition:.18s}.surah:hover{transform:translateY(-3px)}.num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#14915b,#056039);color:#fff;font-weight:900;box-shadow:inset 2px 2px 4px #fff4,4px 6px 10px #063b2740}.meta{margin-left:auto;color:#718078;font-size:12px}.reader{display:none}.reader.show{display:block}.ayah{background:#fbfdfc;border:1px solid #dfebe4;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 18px #173d2c08}.arabic{font-family:serif;font-size:30px;line-height:2.2;text-align:right;direction:rtl}.trans{font-size:16px;line-height:1.9;color:#3f554b;margin-top:10px}.small{font-size:12px;color:#6a786f;line-height:1.7}.btn{border:0;background:linear-gradient(145deg,#13a064,#05643e);color:#fff;box-shadow:inset 2px 2px 5px #fff3,5px 8px 15px #063b2738}.controls{display:flex;gap:10px;flex-wrap:wrap}.loading{text-align:center;padding:30px}.err{background:#fff4f1;color:#9a3d2c;padding:15px;border-radius:14px}@media(max-width:600px){.list{grid-template-columns:1fr}.arabic{font-size:26px}.wrap{padding:10px}.top{border-radius:0 0 20px 20px}}</style></head><body><main class="wrap"><section class="top"><a class="back" href="index.html">← হোমে ফিরে যান</a><h1>📖 কুরআন শরীফ</h1><p>১১৪টি সূরা — যে সূরায় চাপ দেবেন, সেই সূরা এখানেই খুলবে।</p></section><section class="box" id="library"><h2>১১৪টি সূরা</h2><input id="search" class="search" type="search" placeholder="সূরার নাম খুঁজুন…"><div id="list" class="list"></div></section><section id="reader" class="box reader"><div class="controls"><button id="back" class="btn" type="button">← সূরা তালিকা</button></div><div id="title"></div><div id="verses"></div><p class="small">আরবি কুরআন পাঠ Al Quran Cloud-এর উন্মুক্ত API থেকে লোড করা হচ্ছে। উপলব্ধ বাংলা অনুবাদও দেখানো হয়। সূরা খুলতে ইন্টারনেট সংযোগ প্রয়োজন।</p></section></main><script>
const surahs=[['১','আল-ফাতিহা',7],['২','আল-বাকারা',286],['৩','আলে-ইমরান',200],['৪','আন-নিসা',176],['৫','আল-মায়িদা',120],['৬','আল-আনআম',165],['৭','আল-আরাফ',206],['৮','আল-আনফাল',75],['৯','আত-তাওবা',129],['১০','ইউনুস',109],['১১','হুদ',123],['১২','ইউসুফ',111],['১৩','আর-রাদ',43],['১৪','ইবরাহিম',52],['১৫','আল-হিজর',99],['১৬','আন-নাহল',128],['১৭','আল-ইসরা',111],['১৮','আল-কাহফ',110],['১৯','মারইয়াম',98],['২০','ত্বা-হা',135],['২১','আল-আম্বিয়া',112],['২২','আল-হাজ্জ',78],['২৩','আল-মুমিনুন',118],['২৪','আন-নূর',64],['২৫','আল-ফুরকান',77],['২৬','আশ-শুআরা',227],['২৭','আন-নামল',93],['২৮','আল-কাসাস',88],['২৯','আল-আনকাবুত',69],['৩০','আর-রূম',60],['৩১','লুকমান',34],['৩২','আস-সাজদাহ',30],['৩৩','আল-আহযাব',73],['৩৪','সাবা',54],['৩৫','ফাতির',45],['৩৬','ইয়াসীন',83],['৩৭','আস-সাফফাত',182],['৩৮','সাদ',88],['৩৯','আয-যুমার',75],['৪০','গাফির',85],['৪১','ফুসসিলাত',54],['৪২','আশ-শূরা',53],['৪৩','আয-যুখরুফ',89],['৪৪','আদ-দুখান',59],['৪৫','আল-জাসিয়াহ',37],['৪৬','আল-আহকাফ',35],['৪৭','মুহাম্মদ',38],['৪৮','আল-ফাতহ',29],['৪৯','আল-হুজুরাত',18],['৫০','কাফ',45],['৫১','আয-যারিয়াত',60],['৫২','আত-তূর',49],['৫৩','আন-নাজম',62],['৫৪','আল-কামার',55],['৫৫','আর-রহমান',78],['৫৬','আল-ওয়াকিয়াহ',96],['৫৭','আল-হাদীদ',29],['৫৮','আল-মুজাদালাহ',22],['৫৯','আল-হাশর',24],['৬০','আল-মুমতাহিনাহ',13],['৬১','আস-সাফ',14],['৬২','আল-জুমুআহ',11],['৬৩','আল-মুনাফিকুন',11],['৬৪','আত-তাগাবুন',18],['৬৫','আত-তালাক',12],['৬৬','আত-তাহরীম',12],['৬৭','আল-মুলক',30],['৬৮','আল-কলম',52],['৬৯','আল-হাক্কাহ',52],['৭০','আল-মাআরিজ',44],['৭১','নূহ',28],['৭২','আল-জিন',28],['৭৩','আল-মুযযাম্মিল',20],['৭৪','আল-মুদ্দাসসির',56],['৭৫','আল-কিয়ামাহ',40],['৭৬','আল-ইনসান',31],['৭৭','আল-মুরসালাত',50],['৭৮','আন-নাবা',40],['৭৯','আন-নাযিআত',46],['৮০','আবাসা',42],['৮১','আত-তাকভীর',29],['৮২','আল-ইনফিতার',19],['৮৩','আল-মুতাফফিফীন',36],['৮৪','আল-ইনশিকাক',25],['৮৫','আল-বুরূজ',22],['৮৬','আত-তারিক',17],['৮৭','আল-আলা',19],['৮৮','আল-গাশিয়াহ',26],['৮৯','আল-ফজর',30],['৯০','আল-বালাদ',20],['৯১','আশ-শামস',15],['৯২','আল-লাইল',21],['৯৩','আদ-দুহা',11],['৯৪','আশ-শরহ',8],['৯৫','আত-তীন',8],['৯৬','আল-আলাক',19],['৯৭','আল-কদর',5],['৯৮','আল-বাইয়্যিনাহ',8],['৯৯','আয-যিলযাল',8],['১০০','আল-আদিয়াত',11],['১০১','আল-কারিয়াহ',11],['১০২','আত-তাকাসুর',8],['১০৩','আল-আসর',3],['১০৪','আল-হুমাযাহ',9],['১০৫','আল-ফীল',5],['১০৬','কুরাইশ',4],['১০৭','আল-মাউন',7],['১০৮','আল-কাওসার',3],['১০৯','আল-কাফিরুন',6],['১১০','আন-নসর',3],['১১১','আল-মাসাদ',5],['১১২','আল-ইখলাস',4],['১১৩','আল-ফালাক',5],['১১৪','আন-নাস',6]];
const list=document.getElementById('list'),library=document.getElementById('library'),reader=document.getElementById('reader'),title=document.getElementById('title'),verses=document.getElementById('verses');
function render(q=''){const z=q.toLowerCase();list.innerHTML=surahs.filter(s=>s[1].toLowerCase().includes(z)||s[0].includes(z)).map((s,i)=>`<a class="surah" href="#surah-${i+1}" data-id="${i+1}"><span class="num">${s[0]}</span><b>${s[1]}</b><span class="meta">${s[2]} আয়াত ›</span></a>`).join('')||'<p>কোনো সূরা পাওয়া যায়নি।</p>'}
async function openSurah(id){const s=surahs[id-1];if(!s)return;history.pushState({id},'',`#surah-${id}`);library.style.display='none';reader.classList.add('show');title.innerHTML=`<h2>সূরা ${s[1]}</h2><p class="small">${s[2]} আয়াত</p>`;verses.innerHTML='<div class="loading">📖 সূরা লোড হচ্ছে…</div>';try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,bn.bengali`);if(!r.ok)throw new Error('API error');const j=await r.json();const ar=j.data.find(x=>x.edition.identifier==='quran-uthmani');const bn=j.data.find(x=>x.edition.identifier==='bn.bengali');if(!ar)throw new Error('Arabic edition missing');verses.innerHTML=ar.ayahs.map((a,k)=>`<article class="ayah"><div class="arabic">${a.text} <small>﴿${a.numberInSurah}﴾</small></div>${bn&&bn.ayahs[k]?`<div class="trans">${bn.ayahs[k].text}</div>`:''}</article>`).join('')}catch(e){verses.innerHTML='<div class="err">সূরাটি এখন লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</div>'}}
list.addEventListener('click',e=>{const a=e.target.closest('.surah');if(a){e.preventDefault();openSurah(Number(a.dataset.id))}});document.getElementById('search').addEventListener('input',e=>render(e.target.value.trim()));document.getElementById('back').onclick=()=>{reader.classList.remove('show');library.style.display='block';history.pushState({},'',location.pathname)};window.addEventListener('popstate',()=>{const m=location.hash.match(/surah-(\d+)/);if(m)openSurah(Number(m[1]));else{reader.classList.remove('show');library.style.display='block'}});render();if(location.hash){const m=location.hash.match(/surah-(\d+)/);if(m)openSurah(Number(m[1]))}
</script></body></html>
