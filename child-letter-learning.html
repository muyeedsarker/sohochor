<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff7a59"><title>SOHOCHOR — অক্ষর শিখি</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#fff3f7,#eef8ff,#fff9df);color:#26354a}.wrap{max-width:900px;margin:auto;padding:16px 14px 50px}.home{display:inline-flex;padding:11px 18px;border-radius:999px;background:linear-gradient(135deg,#ff6f91,#ff9f43);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 6px 0 #d84c70}.hero{margin:16px 0;padding:25px 20px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#7650e8,#ff6f91,#ffb43b);box-shadow:0 9px 0 #6942bf}.hero h1{margin:0 0 7px;font-size:clamp(28px,8vw,44px)}.hero p{margin:0;font-weight:700;line-height:1.6}.card{background:#ffffffdf;border:3px solid #fff;border-radius:26px;padding:18px;margin:16px 0;box-shadow:0 9px 25px #0002}.title{display:flex;justify-content:space-between;align-items:center;gap:10px}.title h2{margin:0}.listen{border:0;border-radius:999px;padding:11px 15px;color:#fff;background:#7048d6;font-weight:900;cursor:pointer}.letters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}.letter{border:3px solid #fff;border-radius:18px;min-height:70px;font-size:30px;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 #0002;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dff2ff,#ffdfe9)}.letter:active{transform:translateY(5px);box-shadow:0 1px 0 #0002}.hint{text-align:center;margin:14px 0 0;font-weight:800;color:#7048d6}@media(max-width:600px){.letters{grid-template-columns:repeat(4,minmax(0,1fr))}.letter{min-height:64px;font-size:27px}.title{align-items:flex-start;flex-direction:column}.listen{width:100%}}</style></head><body><main class="wrap"><a class="home" href="children.html">🏠 শিশু কর্নার</a><section class="hero"><h1>🔤 অক্ষর শিখি</h1><p>যে অক্ষরের ওপর চাপ দেবে, সেই অক্ষরটি অটো উচ্চারণ হবে। 🔊</p></section><section class="card"><div class="title"><h2>🇧🇩 বাংলা অক্ষর</h2><button class="listen" onclick="speakAll(bn,'bn-BD')">🔊 সব অক্ষর শুনুন</button></div><div id="bn" class="letters"></div><p class="hint">👆 অক্ষরে চাপ দাও → শুনো → আবার চাপ দাও</p></section><section class="card"><div class="title"><h2>🇬🇧 English A–Z</h2><button class="listen" onclick="speakAll(en,'en-US')">🔊 A–Z শুনুন</button></div><div id="en" class="letters"></div><p class="hint">👆 Letter-এ চাপ দিলে উচ্চারণ হবে</p></section></main><script>const bn='অ আ ই ঈ উ ঊ ঋ এ ঐ ও ঔ ক খ গ ঘ ঙ চ ছ জ ঝ ঞ ট ঠ ড ঢ ণ ত থ দ ধ ন প ফ ব ভ ম য র ল শ ষ স হ ড় ঢ় য়'.split(' '),en='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');function speak(text,lang){if(!('speechSynthesis'in window)){alert('এই ডিভাইসে অটো উচ্চারণ সুবিধা পাওয়া যাচ্ছে না।');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.72;u.pitch=1.05;speechSynthesis.speak(u)}function speakAll(arr,lang){if(!('speechSynthesis'in window)){alert('এই ডিভাইসে অটো উচ্চারণ সুবিধা পাওয়া যাচ্ছে না।');return}speechSynthesis.cancel();arr.forEach((x,i)=>setTimeout(()=>speak(x,lang),i*650))}function render(id,arr,lang){const box=document.getElementById(id);arr.forEach(x=>{const b=document.createElement('button');b.className='letter';b.type='button';b.textContent=x;b.setAttribute('aria-label',x+' উচ্চারণ করুন');b.onclick=()=>speak(x,lang);box.appendChild(b)})}render('bn',bn,'bn-BD');render('en',en,'en-US');</script></body></html>
