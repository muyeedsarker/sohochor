<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR — Login</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="theme.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="page"><section class="hero"><div class="hero-kicker">SOHOCHOR — সহচর</div><h1>👤 আমার সহচর</h1><p>Login করে আপনার ব্যক্তিগত জায়গায় প্রবেশ করুন।</p></section><section class="panel"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="আপনার Email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div style="display:grid;gap:10px;margin-top:14px"><button id="login">Login</button><button id="signup" type="button">নতুন Account তৈরি</button></div><p id="msg" class="empty" aria-live="polite"></p></section><p><a href="index.html">← হোমে ফিরে যান</a></p></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');const $=id=>document.getElementById(id);async function go(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='Email ও Password দিন।';return}$('msg').textContent='অপেক্ষা করুন...';const r=mode==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});if(r.error){$('msg').textContent='সমস্যা: '+r.error.message;return}if(mode==='login'){location.href='personal.html'}else{$('msg').textContent='Account তৈরি হয়েছে। Email verification লাগতে পারে; verification-এর পর Login করুন।'}}$('login').onclick=()=>go('login');$('signup').onclick=()=>go('signup');db.auth.getSession().then(({data})=>{if(data.session)location.href='personal.html'});</script></body></html>
