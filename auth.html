<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR — আমার সহচর</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="theme.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#08783f;--gd:#075b31;--gold:#c99a2e;--bg:#f5f8f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eef7f1,#fff 48%,#f8f1dc);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans Bengali",sans-serif;color:#173126}.page{width:min(100%,520px);margin:auto;padding:28px 18px 34px}.brand{text-align:center;margin:8px 0 22px}.mark{width:72px;height:72px;margin:auto;border-radius:24px;background:linear-gradient(145deg,var(--g),var(--gd));display:grid;place-items:center;color:#fff;font-size:32px;box-shadow:0 12px 28px #075b3130;border:3px solid #d7b65a}.brand-name{font-weight:900;letter-spacing:.8px;font-size:20px;color:var(--gd);margin-top:10px}.hero{background:linear-gradient(145deg,#08783f,#064f2c);color:#fff;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 18px 45px #075b3130;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff22;border-radius:50%;right:-70px;top:-80px}.hero-kicker{color:#f0d486;font-weight:800;font-size:14px;letter-spacing:.4px}.hero h1{margin:8px 0;font-size:30px}.hero p{margin:0;color:#e8f5ed;line-height:1.7}.panel{margin-top:16px;background:#ffffffeb;border:1px solid #dce8e0;border-radius:24px;padding:22px;box-shadow:0 14px 38px #17312612;backdrop-filter:blur(8px)}label{display:block;font-weight:800;font-size:14px;margin:4px 0 7px;color:#24513b}input{width:100%;padding:14px 15px;border:1px solid #cddbd2;border-radius:14px;background:#fbfdfc;font-size:16px;outline:none;transition:.2s;margin-bottom:13px}input:focus{border-color:var(--g);box-shadow:0 0 0 4px #08783f16;background:#fff}button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:900;cursor:pointer;transition:.2s}#login{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;box-shadow:0 8px 18px #08783f2e}#login:hover{transform:translateY(-1px)}#signup{background:#fff8e8;color:#76560d;border:1px solid #e2c36e}.security{margin:16px 0 0;text-align:center;font-size:12px;color:#60756a}.home{text-align:center;margin-top:18px}.home a{color:var(--gd);font-weight:800;text-decoration:none}.home a:hover{text-decoration:underline}.empty{min-height:22px;margin:14px 2px 0;text-align:center;font-size:14px;font-weight:700;color:#8b4b12}</style></head><body><main class="page"><div class="brand"><div class="mark">🤝</div><div class="brand-name">SOHOCHOR — সহচর</div></div><section class="hero"><div class="hero-kicker">সংগঠনের সদস্য এলাকা</div><h1>👤 আমার সহচর</h1><p>Login করে আপনার সংগঠনের ব্যক্তিগত জায়গায় নিরাপদে প্রবেশ করুন।</p></section><section class="panel"><label for="email">📧 Email</label><input id="email" type="email" autocomplete="email" placeholder="আপনার Email"><label for="password">🔐 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার Password"><div style="display:grid;gap:10px;margin-top:5px"><button id="login">🔓 Login করুন</button><button id="signup" type="button">✨ নতুন Account তৈরি করুন</button></div><p id="msg" class="empty" aria-live="polite"></p><div class="security">🛡️ আপনার সদস্য এলাকার তথ্য নিরাপদে রাখার জন্য এই Login ব্যবস্থা ব্যবহার করা হয়।</div></section><div class="home"><a href="index.html">← হোমে ফিরে যান</a></div></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');const $=id=>document.getElementById(id);async function go(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='Email ও Password দিন।';return}$('msg').textContent='অপেক্ষা করুন...';const r=mode==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});if(r.error){$('msg').textContent='সমস্যা: '+r.error.message;return}if(mode==='login'){location.href='personal.html'}else{$('msg').textContent='Account তৈরি হয়েছে। Email verification লাগতে পারে; verification-এর পর Login করুন।'}}$('login').onclick=()=>go('login');$('signup').onclick=()=>go('signup');db.auth.getSession().then(({data})=>{if(data.session)location.href='personal.html'});</script></body></html>
