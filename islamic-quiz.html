<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOHOCHOR — Islamic Quiz</title><style>body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0002}.question{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#6a35c7,#087f8c,#16834d);box-shadow:0 3px 12px #0002}.qnum{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff38;box-shadow:0 4px 10px #0004;border:2px solid #fff8;font-size:20px;font-weight:800}.question h3{margin:0}.option{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0;padding:14px;border:3px solid transparent;border-radius:13px;color:#17352b;text-align:left;font-size:16px;cursor:pointer}.option:nth-child(2){background:#ffe1e1;border-color:#ff8d8d}.option:nth-child(3){background:#fff1c9;border-color:#e8c35a}.option:nth-child(4){background:#dff3ff;border-color:#74bce8}.option:nth-child(5){background:#e4f8df;border-color:#7bc56d}.feedback{margin-left:auto;font-size:25px;font-weight:900}.correct{color:#087f45}.wrong{color:#c52222}.selected-correct{box-shadow:0 0 0 3px #18a558}.selected-wrong{box-shadow:0 0 0 3px #e33}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,.home-btn{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.tabs button{background:#e7f3ed;color:#08783f}.tabs button.active{background:#08783f;color:#fff}.home-btn{display:inline-flex;background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;text-decoration:none;margin-bottom:14px}.history{border-left:5px solid #08783f;padding:10px;margin:8px 0;background:#f3faf6;border-radius:10px}.badge{display:inline-block;border-radius:999px;padding:8px 12px;background:#fff0b8;margin:5px;font-weight:800}#submit{background:#176b4d;color:#fff;padding:13px 20px;border:0;border-radius:12px;font-size:17px;cursor:pointer}</style></head><body><main class="wrap"><a class="home-btn" href="./">🏠 Home</a><h1>🕌 ইসলামিক কুইজ</h1><p>জ্ঞান যাচাই করুন, স্কোর জমা রাখুন এবং Badge অর্জন করুন।</p><div class="tabs"><button class="active" onclick="showTab('quiz')">Quiz</button><button onclick="showTab('history')">History</button><button onclick="showTab('badges')">🏅 Badge</button></div><section id="quizTab"><div class="card"><label>Category: <select id="category" onchange="resetQuiz()"><option>সাধারণ ইসলামিক জ্ঞান</option><option>নামাজ</option><option>সিয়াম ও রমজান</option><option>কুরআন</option></select></label><button onclick="dailyQuiz()" style="margin-left:8px;padding:8px;border:0;border-radius:10px">📅 Daily Quiz</button></div><div id="quiz"></div><button id="submit" onclick="submitQuiz()">ফলাফল দেখুন</button><div id="result" class="card" hidden></div></section><section id="historyTab" class="card" hidden><h2>📊 Quiz History</h2><div id="history"></div></section><section id="badgesTab" class="card" hidden><h2>🏅 আমার Badge</h2><div id="badges"></div></section></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');let user=null,answered=false;const qs=[['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2],['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1],['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1],['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0],['সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2],['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0]];const el=document.getElementById('quiz');function build(){answered=false;el.innerHTML='';qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="question"><div class="qnum">${i+1}</div><h3>${q[0]}</h3></div>`+q[1].map((o,j)=>`<button type="button" class="option" onclick="answer(${i},${j},this)"><span>${o}</span><span class="feedback"></span></button>`).join('');el.appendChild(c)})}function answer(i,j,b){if(b.parentElement.querySelector('.selected-correct,.selected-wrong'))return;const ok=j===qs[i][2];b.classList.add(ok?'selected-correct':'selected-wrong');b.querySelector('.feedback').textContent=ok?'✓':'×';b.querySelector('.feedback').className='feedback '+(ok?'correct':'wrong');answered=true}function submitQuiz(){let score=0;qs.forEach((q,i)=>{const b=el.children[i].querySelector('.selected-correct');if(b)score++});const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<div style="font-size:22px;font-weight:800">আপনার স্কোর: ${score}/10</div><p>${score>=9?'🏆 অসাধারণ!':score>=8?'🌟 দারুণ!':'📚 আরও পড়ুন ও আবার চেষ্টা করুন।'}</p>`;saveResult(score)}async function saveResult(score){if(!user)return;await db.from('quiz_history').insert({user_id:user.id,category:category.value,score,total:10});if(score===10)await db.from('quiz_badges').upsert({user_id:user.id,badge:'Perfect 10'});else if(score>=8)await db.from('quiz_badges').upsert({user_id:user.id,badge:'Quiz Master'})}async function loadHistory(){if(!user)return;const r=await db.from('quiz_history').select('category,score,total,quiz_date,created_at').order('created_at',{ascending:false}).limit(30);history.innerHTML=r.error?'History এখনো প্রস্তুত নয়।':r.data.length?r.data.map(x=>`<div class="history">📅 ${x.quiz_date} · ${x.category}<br>⭐ ${x.score}/${x.total}</div>`).join(''):'কোনো History নেই।'}async function loadBadges(){if(!user)return;const r=await db.from('quiz_badges').select('badge,awarded_at').order('awarded_at',{ascending:false});badges.innerHTML=r.error?'Badge এখনো প্রস্তুত নয়।':r.data.length?r.data.map(x=>`<span class="badge">🏅 ${x.badge}</span>`).join(''):'এখনো Badge অর্জিত হয়নি।'}function showTab(t){quizTab.hidden=t!=='quiz';historyTab.hidden=t!=='history';badgesTab.hidden=t!=='badges';if(t==='history')loadHistory();if(t==='badges')loadBadges()}function resetQuiz(){build();result.hidden=true}function dailyQuiz(){category.value='সাধারণ ইসলামিক জ্ঞান';resetQuiz();alert('📅 আজকের Quiz প্রস্তুত!')}async function init(){const {data}=await db.auth.getSession();if(data.session)user=data.session.user;build()}init();</script></body></html>
