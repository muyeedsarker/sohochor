<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>SOHOCHOR — সব ইসলামি কুইজ</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:900px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.home-btn{display:inline-flex;background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:800}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #12372a12}.hero{background:linear-gradient(135deg,#063b27,#08783f);color:#fff}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.9}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.section-title h2{margin:0;font-size:20px}.count{font-size:12px;background:#eaf6ef;color:#087a4a;padding:6px 10px;border-radius:999px;font-weight:800}.search{width:100%;padding:13px 15px;border:2px solid #dbe9e1;border-radius:14px;font-size:15px;outline:0}.search:focus{border-color:#0a8a4e}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.cat{position:relative;border:2px solid #e1ece6;background:#fff;border-radius:16px;padding:13px 11px;text-align:left;cursor:pointer;transition:.18s;min-height:82px}.cat:hover{transform:translateY(-2px);box-shadow:0 8px 18px #12372a12}.cat.selected{border-color:#08783f;background:#eaf8f0;box-shadow:0 0 0 2px #08783f22}.cat .icon{font-size:24px;display:block;margin-bottom:5px}.cat b{font-size:14px}.check{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;display:none;background:#08783f;color:#fff;font-size:14px;text-align:center;line-height:22px}.cat.selected .check{display:block}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#08783f,#10a35c);color:#fff}.secondary{background:#eaf6ef;color:#08783f}.quiz-q{padding:18px;border-radius:17px;background:#fff;box-shadow:0 5px 20px #12372a12;margin:14px 0}.question{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#6a35c7,#087f8c,#16834d)}.qnum{width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;background:#ffffff35;border:2px solid #fff8;font-weight:900}.question h3{margin:2px 0;font-size:17px}.option{display:flex;align-items:center;gap:10px;width:100%;margin:9px 0;padding:13px;border:2px solid #e2ece7;border-radius:13px;background:#fff;text-align:left;font-size:15px;cursor:pointer}.option:hover{background:#f5faf7}.choice-label{font-weight:900;min-width:26px}.feedback{margin-left:auto;font-size:22px;font-weight:900}.selected-correct{border-color:#18a558!important;background:#e8f9ee!important}.selected-wrong{border-color:#e33!important;background:#fff0f0!important}.correct{color:#087f45}.wrong{color:#c52222}.empty{text-align:center;padding:24px;color:#687a71}.result{font-size:20px;font-weight:900}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7f3ed;color:#08783f}.tabs button.active{background:#08783f;color:#fff}.history{border-left:5px solid #08783f;padding:10px;margin:8px 0;background:#f3faf6;border-radius:10px}.badge{display:inline-block;border-radius:999px;padding:8px 12px;background:#fff0b8;margin:5px;font-weight:800}@media(max-width:520px){.wrap{padding:12px 10px 85px}.hero h1{font-size:24px}.categories{grid-template-columns:repeat(2,1fr);gap:8px}.cat{min-height:78px}.top{align-items:flex-start}.section-title{align-items:flex-start}}</style>
</head><body><main class="wrap">
<div class="top"><a class="home-btn" href="./">🏠 হোম</a><a class="home-btn" href="all-features.html">☷ ফিচার</a></div>
<section class="card hero"><h1>🕌 সব ইসলামি কুইজ</h1><p>আপনার পছন্দের বিষয় নির্বাচন করুন, কুইজ শুরু করুন এবং জ্ঞান যাচাই করুন।</p></section>
<section class="card"><div class="section-title"><h2>🎯 কুইজের বিষয় নির্বাচন করুন</h2><span class="count" id="selectedCount">১টি নির্বাচিত</span></div><input id="search" class="search" placeholder="🔎 বিষয় খুঁজুন..." oninput="renderCategories()"><div class="categories" id="categories"></div><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="selectAll()">☑️ সব নির্বাচন</button><button class="btn secondary" onclick="clearAll()">✖ নির্বাচন বাতিল</button><button class="btn primary" onclick="startQuiz()">🚀 কুইজ শুরু করুন</button></div></section>
<section class="card"><div class="tabs"><button class="active" onclick="showTab('quiz')">📝 Quiz</button><button onclick="showTab('history')">📊 History</button><button onclick="showTab('badges')">🏅 Badge</button></div></section>
<section id="quizTab"><div id="quiz"></div><button id="submit" class="btn primary" onclick="submitQuiz()" hidden>ফলাফল দেখুন</button><div id="result" class="card" hidden></div></section>
<section id="historyTab" class="card" hidden><h2>📊 Quiz History</h2><div id="history">লগইন করলে ইতিহাস দেখা যাবে।</div></section>
<section id="badgesTab" class="card" hidden><h2>🏅 আমার Badge</h2><div id="badges">লগইন করলে Badge দেখা যাবে।</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');let user=null,currentQuestions=[];
const categories=[['🟢','দ্বীন'],['📖','কুরআন'],['📜','হাদিস'],['🕋','সীরাত'],['👳','সাহাবায়ে কেরাম'],['👩','সাহাবিয়াত'],['🌟','নবী-রাসূল'],['🧠','আকিদাহ'],['⚖️','ফিকহ'],['🧎','নামাজ'],['🌙','রোজা'],['💰','যাকাত'],['🕋','হজ ও উমরাহ'],['🤲','দোয়া ও যিকির'],['📿','তাসবিহ'],['❤️','আখলাক ও চরিত্র'],['👨‍👩‍👧','পরিবার ও ইসলাম'],['🕌','মসজিদ'],['📅','ইসলামি মাস ও তারিখ'],['🌙','রমজান'],['🐑','কুরবানি'],['📚','ইসলামি ইতিহাস'],['⚔️','ইসলামের যুদ্ধ ও অভিযান'],['🏛️','ইসলামি সভ্যতা'],['🗣️','আরবি ও কুরআনিক শব্দ'],['📜','তাফসির'],['🌟','দাওয়াহ'],['🟢','জামায়াতে ইসলামী'],['☪️','মিশ্র ইসলামি']];let selected=new Set(['দ্বীন']);
const bank={'দ্বীন':[['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2]],'কুরআন':[['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1]],'রোজা':[['সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2]],'নামাজ':[['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0]],'হজ ও উমরাহ':[['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1]],'যাকাত':[['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0]],'মিশ্র ইসলামি':[['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0],['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2]]};const fallback=[['ইসলামের একটি গুরুত্বপূর্ণ ইবাদত কোনটি?',['সালাত','খেলাধুলা','ভ্রমণ','ব্যবসা'],0],['মুসলমানদের পবিত্র কিতাব কোনটি?',['কুরআন','ইতিহাস','কবিতা','উপন্যাস'],0]];
function renderCategories(){const q=document.getElementById('search').value.trim().toLowerCase(),box=document.getElementById('categories');box.innerHTML='';categories.filter(c=>c[1].toLowerCase().includes(q)).forEach(c=>{const b=document.createElement('button');b.className='cat'+(selected.has(c[1])?' selected':'');b.innerHTML=`<span class="icon">${c[0]}</span><b>${c[1]}</b><span class="check">✓</span>`;b.onclick=()=>{selected.has(c[1])?selected.delete(c[1]):selected.add(c[1]);renderCategories();updateCount()};box.appendChild(b)});if(!box.children.length)box.innerHTML='<div class="empty">কোনো বিষয় পাওয়া যায়নি।</div>'}
function updateCount(){document.getElementById('selectedCount').textContent=selected.size+'টি নির্বাচিত'}function selectAll(){categories.forEach(c=>selected.add(c[1]));renderCategories();updateCount()}function clearAll(){selected.clear();renderCategories();updateCount()}
function startQuiz(){if(!selected.size){alert('অনুগ্রহ করে অন্তত একটি বিষয় নির্বাচন করুন।');return}currentQuestions=[];selected.forEach(c=>(bank[c]||fallback).forEach(q=>currentQuestions.push([c,...q])));currentQuestions=currentQuestions.slice(0,20);buildQuiz();document.getElementById('quizTab').scrollIntoView({behavior:'smooth'})}
function buildQuiz(){document.getElementById('result').hidden=true;const el=document.getElementById('quiz');el.innerHTML='';const labels=['ক','খ','গ','ঘ'];currentQuestions.forEach((q,i)=>{const c=document.createElement('section');c.className='quiz-q';c.innerHTML=`<div class="question"><div class="qnum">${i+1}</div><div><small>${q[0]}</small><h3>${q[1]}</h3></div></div>`+q[2].map((o,j)=>`<button type="button" class="option" onclick="answer(${i},${j},this)"><span class="choice-label">${labels[j]}.</span><span>${o}</span><span class="feedback"></span></button>`).join('');el.appendChild(c)});document.getElementById('submit').hidden=false}
function answer(i,j,b){const p=b.parentElement;if(p.querySelector('.selected-correct,.selected-wrong'))return;const ok=j===currentQuestions[i][3];b.classList.add(ok?'selected-correct':'selected-wrong');b.querySelector('.feedback').textContent=ok?'✓':'×';b.querySelector('.feedback').className='feedback '+(ok?'correct':'wrong')}
function submitQuiz(){let score=0;currentQuestions.forEach((q,i)=>{if(document.getElementById('quiz').children[i].querySelector('.selected-correct'))score++});const total=currentQuestions.length||1,r=document.getElementById('result');r.hidden=false;r.innerHTML=`<div class="result">🏆 আপনার স্কোর: ${score}/${total}</div><p>${score===total?'মাশাআল্লাহ! অসাধারণ!':score/total>=.8?'🌟 দারুণ ফলাফল!':'📚 আরও পড়ুন ও আবার চেষ্টা করুন।'}</p>`;saveResult(score,total)}
async function saveResult(score,total){if(!user)return;try{await db.from('quiz_history').insert({user_id:user.id,category:Array.from(selected).join(', '),score,total})}catch(e){console.log(e)}}
async function loadHistory(){if(!user){history.textContent='লগইন করলে ইতিহাস দেখা যাবে।';return}const r=await db.from('quiz_history').select('category,score,total,quiz_date,created_at').order('created_at',{ascending:false}).limit(30);history.innerHTML=r.error?'History এখনো প্রস্তুত নয়.':r.data?.length?r.data.map(x=>`<div class="history">📅 ${x.quiz_date||x.created_at||''}<br>📚 ${x.category}<br>⭐ ${x.score}/${x.total}</div>`).join(''):'কোনো History নেই।'}
async function loadBadges(){if(!user){badges.textContent='লগইন করলে Badge দেখা যাবে।';return}const r=await db.from('quiz_badges').select('badge,awarded_at').order('awarded_at',{ascending:false});badges.innerHTML=r.error?'Badge এখনো প্রস্তুত নয়.':r.data?.length?r.data.map(x=>`<span class="badge">🏅 ${x.badge}</span>`).join(''):'এখনো Badge অর্জিত হয়নি।'}
function showTab(t){quizTab.hidden=t!=='quiz';historyTab.hidden=t!=='history';badgesTab.hidden=t!=='badges';document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['quiz','history','badges'][i]===t));if(t==='history')loadHistory();if(t==='badges')loadBadges()}
async function init(){try{const {data}=await db.auth.getSession();if(data.session)user=data.session.user}catch(e){}renderCategories();updateCount();startQuiz()}init();
</script></body></html>
