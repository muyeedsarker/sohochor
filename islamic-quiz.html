<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islamic Quiz</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f5;color:#17352b}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#176b4d;color:white;font-size:16px;cursor:pointer}.option{display:block;width:100%;margin:9px 0;background:#eef4f1;color:#17352b;text-align:left}.result{font-size:20px;font-weight:700}
</style></head>
<body><main class="wrap"><h1>🕌 ইসলামিক কুইজ</h1><p>সাধারণ ইসলামিক জ্ঞান যাচাই করুন।</p><div id="quiz"></div><button onclick="submitQuiz()">ফলাফল দেখুন</button><div id="result" class="card" hidden></div></main>
<script>
const qs=[
['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],
['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],
['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],
['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2],
['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1],
['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1],
['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0],
['ইসলামে সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],
['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2],
['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0]
];
const el=document.getElementById('quiz');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<h3>${i+1}. ${q[0]}</h3>`+q[1].map((o,j)=>`<button class="option"><label><input type="radio" name="q${i}" value="${j}"> ${o}</label></button>`).join('');el.appendChild(c)});
function submitQuiz(){let score=0;qs.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2])score++});const r=document.getElementById('result');r.hidden=false;r.innerHTML=`আপনার স্কোর: ${score}/${qs.length}<br><small>${score>=8?'দারুণ!':'আরও পড়ুন ও আবার চেষ্টা করুন।'}</small>`;window.scrollTo({top:r.offsetTop,behavior:'smooth'})}
</script></body></html>
