<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islamic Quiz</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0002}.question{padding:15px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#6a35c7,#087f8c,#16834d);box-shadow:0 3px 12px #0002}.option{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0;padding:14px;border:3px solid transparent;border-radius:13px;color:#17352b;text-align:left;font-size:16px;cursor:pointer;transition:.15s}.option:nth-child(2){background:#ffe1e1;border-color:#ff8d8d}.option:nth-child(3){background:#fff1c9;border-color:#e8c35a}.option:nth-child(4){background:#dff3ff;border-color:#74bce8}.option:nth-child(5){background:#e4f8df;border-color:#7bc56d}.option:hover{transform:translateY(-1px);filter:brightness(.98)}.option input{accent-color:#176b4d}.feedback{margin-left:auto;font-size:22px;font-weight:800}.correct{color:#087f45}.wrong{color:#c52222}.selected-correct{box-shadow:0 0 0 3px #18a558}.selected-wrong{box-shadow:0 0 0 3px #e33}.result{font-size:20px;font-weight:700}.review{font-size:16px;font-weight:400;border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.explain{font-size:14px;font-weight:400;margin-top:6px}.unanswered{color:#9a6700}#submit{background:#176b4d;color:#fff;padding:13px 20px;border:0;border-radius:12px;font-size:17px;cursor:pointer}
</style></head>
<body><main class="wrap"><h1>🕌 ইসলামিক কুইজ</h1><p>সাধারণ ইসলামিক জ্ঞান যাচাই করুন।</p><div id="quiz"></div><button id="submit" onclick="submitQuiz()">ফলাফল দেখুন</button><div id="result" class="card" hidden></div></main>
<script>
const qs=[
['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0,'শাহাদাহ ইসলামের পাঁচটি স্তম্ভের প্রথম।'],
['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0,'কুরআন আরবি ভাষায় নাজিল হয়েছে।'],
['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2,'প্রতিদিন পাঁচ ওয়াক্ত ফরজ সালাত রয়েছে।'],
['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2,'সাওম বা রোজা ইসলামের পাঁচটি স্তম্ভের একটি।'],
['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1,'হজের প্রধান ইবাদতগুলো মক্কা ও তার আশপাশের পবিত্র স্থানে অনুষ্ঠিত হয়।'],
['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1,'মুসহাফের বিন্যাসে প্রথম সূরা হলো আল-ফাতিহা।'],
['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0,'নির্দিষ্ট শর্ত ও নিসাব পূরণকারী যোগ্য সম্পদের ওপর যাকাত প্রযোজ্য।'],
['ইসলামে সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1,'সাওম অর্থ রোজা বা নির্দিষ্ট সময় পানাহারসহ কিছু বিষয় থেকে বিরত থাকা।'],
['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2,'শুক্রবার জুমার বিশেষ জামাত অনুষ্ঠিত হয়।'],
['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0,'আখিরাতে বিশ্বাস ঈমানের মৌলিক বিষয়গুলোর অন্তর্ভুক্ত।']
];
const el=document.getElementById('quiz');
qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="question"><h3>${i+1}. ${q[0]}</h3></div>`+q[1].map((o,j)=>`<button type="button" class="option" data-q="${i}" data-a="${j}" onclick="answer(${i},${j},this)"><input type="radio" name="q${i}" value="${j}" tabindex="-1"><span>${o}</span><span class="feedback"></span></button>`).join('');el.appendChild(c)});
function answer(i,j,btn){const q=qs[i];const box=btn.parentElement;box.querySelectorAll('.option').forEach(b=>{b.classList.remove('selected-correct','selected-wrong');b.querySelector('.feedback').textContent='';b.querySelector('input').checked=false;b.disabled=true});btn.querySelector('input').checked=true;const ok=j===q[2];btn.classList.add(ok?'selected-correct':'selected-wrong');btn.querySelector('.feedback').textContent=ok?'✓':'×';btn.querySelector('.feedback').className='feedback '+(ok?'correct':'wrong')}
function submitQuiz(){let score=0,html='';qs.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);const correct=q[1][q[2]];if(a&&+a.value===q[2]){score++;html+=`<div class="review correct">${i+1}. ✓ সঠিক উত্তর: ${correct}<div class="explain">${q[3]}</div></div>`}else if(a){html+=`<div class="review wrong">${i+1}. × আপনার উত্তর: ${q[1][+a.value]}<br>✓ সঠিক উত্তর: ${correct}<div class="explain">${q[3]}</div></div>`}else{html+=`<div class="review unanswered">${i+1}. ⚠️ উত্তর দেওয়া হয়নি<br>✓ সঠিক উত্তর: ${correct}<div class="explain">${q[3]}</div></div>`}});const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<div>আপনার স্কোর: ${score}/${qs.length}</div><small>${score>=8?'দারুণ!':'আরও পড়ুন ও আবার চেষ্টা করুন।'}</small>${html}`;window.scrollTo({top:r.offsetTop,behavior:'smooth'})}
</script></body></html>
