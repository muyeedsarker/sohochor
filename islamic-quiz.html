<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27">
<title>SOHOCHOR — সব ইসলামি কুইজ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:820px;margin:auto;padding:16px 12px 90px}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.home-btn{display:inline-flex;background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:800}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #12372a12}.hero{background:linear-gradient(135deg,#063b27,#08783f);color:#fff}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.92}.selector-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid #b9ddca;background:linear-gradient(135deg,#f5fff8,#eaf8f0);color:#08783f;border-radius:16px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;text-align:left}.selector-btn small{display:block;font-size:12px;font-weight:700;color:#638074;margin-top:3px}.selector-panel{display:none;margin-top:10px;border:2px solid #d8e9df;border-radius:17px;background:#fff;overflow:hidden}.selector-panel.open{display:block}.panel-head{padding:12px;border-bottom:1px solid #e5eee9;background:#f8fcfa}.search{width:100%;padding:12px 14px;border:2px solid #dbe9e1;border-radius:12px;font-size:15px;outline:0}.panel-actions{display:flex;gap:8px;margin-top:9px}.mini{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:#eaf6ef;color:#08783f}.category-list{max-height:330px;overflow-y:auto;padding:8px}.category-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer}.category-item:hover{background:#f1faf5}.category-item input{width:19px;height:19px;accent-color:#08783f}.cat-icon{font-size:22px;width:28px}.cat-name{font-weight:800}.done{width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:12px;background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;font-weight:900;cursor:pointer}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#08783f,#10a35c);color:#fff}.secondary{background:#eaf6ef;color:#08783f}.quiz-q{padding:18px;border-radius:17px;background:#fff;box-shadow:0 5px 20px #12372a12;margin:14px 0}.question{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#6a35c7,#087f8c,#16834d)}.qnum{width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;background:#ffffff35;border:2px solid #fff8;font-weight:900}.question h3{margin:2px 0;font-size:17px}.option{display:flex;align-items:center;gap:10px;width:100%;margin:9px 0;padding:13px;border:2px solid #e2ece7;border-radius:13px;background:#fff;text-align:left;font-size:15px;cursor:pointer}.choice-label{font-weight:900;min-width:26px}.feedback{margin-left:auto;font-size:22px;font-weight:900}.selected-correct{border-color:#18a558!important;background:#e8f9ee!important}.selected-wrong{border-color:#e33!important;background:#fff0f0!important}.correct{color:#087f45}.wrong{color:#c52222}.empty{text-align:center;padding:24px;color:#687a71}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7f3ed;color:#08783f}.tabs button.active{background:#08783f;color:#fff}.history{border-left:5px solid #08783f;padding:10px;margin:8px 0;background:#f3faf6;border-radius:10px}.badge{display:inline-block;border-radius:999px;padding:8px 12px;background:#fff0b8;margin:5px;font-weight:800}@media(max-width:520px){.wrap{padding:12px 10px 85px}.hero h1{font-size:24px}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a class="home-btn" href="./">🏠 হোম</a><a class="home-btn" href="all-features.html">☷ ফিচার</a></div>
<section class="card hero"><h1>🕌 সব ইসলামি কুইজ</h1><p>একটি বাটনে সব বিষয়—স্ক্রল করে আপনার পছন্দের বিষয় নির্বাচন করুন।</p></section>
<section class="card"><button id="selectorBtn" class="selector-btn" onclick="toggleSelector()"><span>🎯 কুইজের বিষয় নির্বাচন করুন<small id="selectedText">১টি বিষয় নির্বাচিত</small></span><span id="arrow">⌄</span></button>
<div id="selectorPanel" class="selector-panel"><div class="panel-head"><input id="search" class="search" placeholder="🔎 বিষয় খুঁজুন..." oninput="renderCategories()"><div class="panel-actions"><button class="mini" onclick="selectAll();event.stopPropagation()">☑️ সব নির্বাচন</button><button class="mini" onclick="clearAll();event.stopPropagation()">✖ সব বাতিল</button></div></div><div id="categoryList" class="category-list"></div><button class="done" onclick="closeSelector()">✓ নির্বাচন সম্পন্ন</button></div>
<div class="actions"><button class="btn primary" onclick="startQuiz()">🚀 কুইজ শুরু করুন</button></div></section>
<section class="card"><div class="tabs"><button class="active" onclick="showTab('quiz')">📝 Quiz</button><button onclick="showTab('history')">📊 History</button><button onclick="showTab('badges')">🏅 Badge</button></div></section>
<section id="quizTab"><div id="quiz"></div><button id="submit" class="btn primary" onclick="submitQuiz()" hidden>ফলাফল দেখুন</button><div id="result" class="card" hidden></div></section>
<section id="historyTab" class="card" hidden><h2>📊 Quiz History</h2><div id="history">লগইন করলে ইতিহাস দেখা যাবে।</div></section>
<section id="badgesTab" class="card" hidden><h2>🏅 আমার Badge</h2><div id="badges">লগইন করলে Badge দেখা যাবে।</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');
let user=null,currentQuestions=[],selected=new Set(['দ্বীন']);
const labels=['ক','খ','গ','ঘ'];
const categories=[['🟢','দ্বীন'],['📖','কুরআন'],['📜','হাদিস'],['🕋','সীরাত'],['👳','সাহাবায়ে কেরাম'],['👩','সাহাবিয়াত'],['🌟','নবী-রাসূল'],['🧠','আকিদাহ'],['⚖️','ফিকহ'],['🧎','নামাজ'],['🌙','রোজা'],['💰','যাকাত'],['🕋','হজ ও উমরাহ'],['🤲','দোয়া ও যিকির'],['📿','তাসবিহ'],['❤️','আখলাক ও চরিত্র'],['👨‍👩‍👧','পরিবার ও ইসলাম'],['🕌','মসজিদ'],['📅','ইসলামি মাস ও তারিখ'],['🌙','রমজান'],['🐑','কুরবানি'],['📚','ইসলামি ইতিহাস'],['⚔️','ইসলামের যুদ্ধ ও অভিযান'],['🏛️','ইসলামি সভ্যতা'],['🗣️','আরবি ও কুরআনিক শব্দ'],['📜','তাফসির'],['🌟','দাওয়াহ'],['🟢','জামায়াতে ইসলামী'],['☪️','মিশ্র ইসলামি']];
const bank={'দ্বীন':[['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2]],'কুরআন':[['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1]],'রোজা':[['সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2]],'নামাজ':[['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0]],'হজ ও উমরাহ':[['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1]],'যাকাত':[['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0]],'মিশ্র ইসলামি':[['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0],['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2]]};
const fallback=[['ইসলামের একটি গুরুত্বপূর্ণ ইবাদত কোনটি?',['সালাত','খেলাধুলা','ভ্রমণ','ব্যবসা'],0],['মুসলমানদের পবিত্র কিতাব কোনটি?',['কুরআন','ইতিহাস','কবিতা','উপন্যাস'],0]];
function toggleSelector(){const p=document.getElementById('selectorPanel');p.classList.toggle('open');document.getElementById('arrow').textContent=p.classList.contains('open')?'⌃':'⌄'}
function closeSelector(){document.getElementById('selectorPanel').classList.remove('open');document.getElementById('arrow').textContent='⌄';updateCount()}
function updateCount(){document.getElementById('selectedText').textContent=selected.size+'টি বিষয় নির্বাচিত'}
function renderCategories(){const q=document.getElementById('search').value.trim().toLowerCase(),box=document.getElementById('categoryList');box.innerHTML='';categories.filter(c=>c[1].toLowerCase().includes(q)).forEach(c=>{const label=document.createElement('label');label.className='category-item';label.innerHTML=`<input type="checkbox" ${selected.has(c[1])?'checked':''}><span class="cat-icon">${c[0]}</span><span class="cat-name">${c[1]}</span>`;label.querySelector('input').onchange=e=>{e.target.checked?selected.add(c[1]):selected.delete(c[1]);updateCount()};box.appendChild(label)});if(!box.children.length)box.innerHTML='<div class="empty">কোনো বিষয় পাওয়া যায়নি।</div>'}
function selectAll(){categories.forEach(c=>selected.add(c[1]));renderCategories();updateCount()}
function clearAll(){selected.clear();renderCategories();updateCount()}
function startQuiz(){if(!selected.size){alert('কমপক্ষে একটি বিষয় নির্বাচন করুন।');return}currentQuestions=[];selected.forEach(c=>(bank[c]||fallback).forEach(q=>currentQuestions.push({...q,category:c})));currentQuestions=currentQuestions.sort(()=>Math.random()-.5).slice(0,10);buildQuiz();document.getElementById('result').hidden=true;document.getElementById('submit').hidden=false;document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
function buildQuiz(){const el=document.getElementById('quiz');el.innerHTML='';currentQuestions.forEach((q,i)=>{const c=document.createElement('section');c.className='quiz-q';c.innerHTML=`<div class="question"><div class="qnum">${i+1}</div><div><small>${q.category}</small><h3>${q[0]}</h3></div></div>`+q[1].map((o,j)=>`<button type="button" class="option" onclick="answer(${i},${j},this)"><span class="choice-label">${labels[j]}.</span><span>${o}</span><span class="feedback"></span></button>`).join('');el.appendChild(c)})}
function answer(i,j,b){const box=b.parentElement;if(box.querySelector('.selected-correct,.selected-wrong'))return;const ok=j===currentQuestions[i][2];b.classList.add(ok?'selected-correct':'selected-wrong');b.querySelector('.feedback').textContent=ok?'✓':'×';b.querySelector('.feedback').className='feedback '+(ok?'correct':'wrong')}
function submitQuiz(){let score=0;currentQuestions.forEach((q,i)=>{if(document.getElementById('quiz').children[i].querySelector('.selected-correct'))score++});const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<div style="font-size:22px;font-weight:800">আপনার স্কোর: ${score}/${currentQuestions.length}</div><p>${score===currentQuestions.length?'🏆 অসাধারণ!':score>=8?'🌟 দারুণ!':'📚 আরও পড়ুন ও আবার চেষ্টা করুন।'}</p>`;saveResult(score);r.scrollIntoView({behavior:'smooth'})}
async function saveResult(score){if(!user)return;const cat=[...selected].join(', ');try{await db.from('quiz_history').insert({user_id:user.id,category:cat,score,total:currentQuestions.length})}catch(e){}}
async function loadHistory(){if(!user)return;const r=await db.from('quiz_history').select('category,score,total,quiz_date,created_at').order('created_at',{ascending:false}).limit(30);document.getElementById('history').innerHTML=r.error?'History এখনো প্রস্তুত নয়।':r.data?.length?r.data.map(x=>`<div class="history">📅 ${x.quiz_date||''} · ${x.category}<br>⭐ ${x.score}/${x.total}</div>`).join(''):'কোনো History নেই।'}
async function loadBadges(){if(!user)return;const r=await db.from('quiz_badges').select('badge,awarded_at').order('awarded_at',{ascending:false});document.getElementById('badges').innerHTML=r.error?'Badge এখনো প্রস্তুত নয়।':r.data?.length?r.data.map(x=>`<span class="badge">🏅 ${x.badge}</span>`).join(''):'এখনো Badge অর্জিত হয়নি।'}
function showTab(t){document.getElementById('quizTab').hidden=t!=='quiz';document.getElementById('historyTab').hidden=t!=='history';document.getElementById('badgesTab').hidden=t!=='badges';document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['quiz','history','badges'][i]===t));if(t==='history')loadHistory();if(t==='badges')loadBadges()}
async function init(){const {data}=await db.auth.getSession();if(data.session)user=data.session.user;renderCategories();updateCount()}
init();
</script></body></html>
