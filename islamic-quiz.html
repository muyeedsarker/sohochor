<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27">
<title>SOHOCHOR — ইসলামি কুইজ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:820px;margin:auto;padding:16px 12px 90px}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.home-btn{display:inline-flex;background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:800}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #12372a12}.hero{background:linear-gradient(135deg,#063b27,#08783f);color:#fff}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.92}.selector-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid #b9ddca;background:linear-gradient(135deg,#f5fff8,#eaf8f0);color:#08783f;border-radius:16px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;text-align:left}.selector-btn small{display:block;font-size:12px;font-weight:700;color:#638074;margin-top:3px}.selector-panel{display:none;margin-top:10px;border:2px solid #d8e9df;border-radius:17px;background:#fff;overflow:hidden}.selector-panel.open{display:block}.panel-head{padding:12px;border-bottom:1px solid #e5eee9;background:#f8fcfa}.search{width:100%;padding:12px 14px;border:2px solid #dbe9e1;border-radius:12px;font-size:15px;outline:0}.category-list{max-height:330px;overflow-y:auto;padding:8px}.category-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer}.category-item:hover{background:#f1faf5}.category-item.active{background:#e8f8ef;border:2px solid #9bd3b4}.cat-icon{font-size:22px;width:28px}.cat-name{font-weight:800}.select-dot{margin-left:auto;width:23px;height:23px;border:2px solid #aac7b8;border-radius:50%;display:grid;place-items:center;font-size:14px;color:transparent}.category-item.active .select-dot{background:#08783f;border-color:#08783f;color:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#08783f,#10a35c);color:#fff}.secondary{background:#eaf6ef;color:#08783f}.quiz-q{padding:18px;border-radius:17px;background:#fff;box-shadow:0 5px 20px #12372a12;margin:14px 0}.question{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#6a35c7,#087f8c,#16834d)}.qnum{width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;background:#ffffff35;border:2px solid #fff8;font-weight:900}.question h3{margin:2px 0;font-size:17px}.option{display:block;width:100%;margin:9px 0;padding:13px;border:2px solid #e2ece7;border-radius:13px;background:#fff;text-align:left;font-size:15px;cursor:pointer}.option:disabled{cursor:default}.choice-label{font-weight:900;min-width:26px}.feedback{float:right;font-size:22px;font-weight:900}.selected-correct{border-color:#18a558!important;background:#e8f9ee!important}.selected-wrong{border-color:#e33!important;background:#fff0f0!important}.correct{color:#087f45}.wrong{color:#c52222}.next-btn{width:100%;margin-top:8px}.empty{text-align:center;padding:24px;color:#687a71}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7f3ed;color:#08783f}.tabs button.active{background:#08783f;color:#fff}.history{border-left:5px solid #08783f;padding:10px;margin:8px 0;background:#f3faf6;border-radius:10px}.badge{display:inline-block;border-radius:999px;padding:8px 12px;background:#fff0b8;margin:5px;font-weight:800}@media(max-width:520px){.wrap{padding:12px 10px 85px}.hero h1{font-size:24px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a class="home-btn" href="./">🏠 হোম</a><a class="home-btn" href="all-features.html">☷ ফিচার</a></div>
<section class="card hero"><h1>🕌 ইসলামি কুইজ</h1><p>একটি বিষয় নির্বাচন করুন। তারপর একটির পর একটি কুইজ প্রশ্ন আসবে।</p></section>
<section class="card"><button id="selectorBtn" class="selector-btn" onclick="toggleSelector()"><span>🎯 কুইজের বিষয় নির্বাচন করুন<small id="selectedText">একটি বিষয় নির্বাচন করুন</small></span><span id="arrow">⌄</span></button>
<div id="selectorPanel" class="selector-panel"><div class="panel-head"><input id="search" class="search" placeholder="🔎 বিষয় খুঁজুন..." oninput="renderCategories()"></div><div id="categoryList" class="category-list"></div></div>
<div class="actions"><button class="btn primary" onclick="startQuiz()">🚀 কুইজ শুরু করুন</button></div></section>
<section class="card"><div class="tabs"><button class="active" onclick="showTab('quiz')">📝 Quiz</button><button onclick="showTab('history')">📊 History</button><button onclick="showTab('badges')">🏅 Badge</button></div></section>
<section id="quizTab"><div id="quiz"></div><div id="result" class="card" hidden></div></section>
<section id="historyTab" class="card" hidden><h2>📊 Quiz History</h2><div id="history">লগইন করলে ইতিহাস দেখা যাবে।</div></section>
<section id="badgesTab" class="card" hidden><h2>🏅 আমার Badge</h2><div id="badges">লগইন করলে Badge দেখা যাবে।</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');
let user=null,currentQuestions=[],selected=null,currentIndex=0,score=0,answered=false;
const labels=['ক','খ','গ','ঘ'];
const categories=[['🟢','সব ইসলামি কুইজ'],['🕌','দ্বীন'],['📖','কুরআন'],['📜','হাদিস'],['🕋','সীরাত'],['👳','সাহাবায়ে কেরাম'],['👩','সাহাবিয়াত'],['🌟','নবী-রাসূল'],['🧠','আকিদাহ'],['⚖️','ফিকহ'],['🧎','নামাজ'],['🌙','রোজা'],['💰','যাকাত'],['🕋','হজ ও উমরাহ'],['🤲','দোয়া ও যিকির'],['📿','তাসবিহ'],['❤️','আখলাক ও চরিত্র'],['👨‍👩‍👧','পরিবার ও ইসলাম'],['🕌','মসজিদ'],['📅','ইসলামি মাস ও তারিখ'],['🌙','রমজান'],['🐑','কুরবানি'],['📚','ইসলামি ইতিহাস'],['⚔️','ইসলামের যুদ্ধ ও অভিযান'],['🏛️','ইসলামি সভ্যতা'],['🗣️','আরবি ও কুরআনিক শব্দ'],['📜','তাফসির'],['🌟','দাওয়াহ'],['🟢','জামায়াতে ইসলামী'],['☪️','মিশ্র ইসলামি']];
const bank={'দ্বীন':[['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2]],'কুরআন':[['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1]],'রোজা':[['সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2]],'নামাজ':[['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0]],'হজ ও উমরাহ':[['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1]],'যাকাত':[['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0]],'মিশ্র ইসলামি':[['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0],['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2]]};
const fallback=[['ইসলামের একটি গুরুত্বপূর্ণ ইবাদত কোনটি?',['সালাত','খেলাধুলা','ভ্রমণ','ব্যবসা'],0],['মুসলমানদের পবিত্র কিতাব কোনটি?',['কুরআন','ইতিহাস','কবিতা','উপন্যাস'],0]];
function toggleSelector(){const p=document.getElementById('selectorPanel');p.classList.toggle('open');document.getElementById('arrow').textContent=p.classList.contains('open')?'⌃':'⌄';if(p.classList.contains('open'))renderCategories()}
function renderCategories(){const q=(document.getElementById('search').value||'').trim();const list=document.getElementById('categoryList');const arr=categories.filter(c=>!q||c[1].includes(q));list.innerHTML=arr.map(c=>`<div class="category-item ${selected===c[1]?'active':''}" onclick="chooseCategory('${c[1].replace(/'/g,"\\'")}')"><span class="cat-icon">${c[0]}</span><span class="cat-name">${c[1]}</span><span class="select-dot">✓</span></div>`).join('')||'<div class="empty">কোনো বিষয় পাওয়া যায়নি</div>'}
function chooseCategory(name){selected=name;document.getElementById('selectedText').textContent='নির্বাচিত: '+name;document.getElementById('selectorPanel').classList.remove('open');document.getElementById('arrow').textContent='⌄';renderCategories()}
function startQuiz(){if(!selected){alert('আগে একটি বিষয় নির্বাচন করুন।');toggleSelector();return}currentIndex=0;score=0;answered=false;const source=selected==='সব ইসলামি কুইজ'?Object.values(bank).flat(): (bank[selected]||fallback);currentQuestions=[...source].sort(()=>Math.random()-.5);document.getElementById('result').hidden=true;showTab('quiz');renderQuestion();window.scrollTo({top:document.getElementById('quiz').offsetTop-20,behavior:'smooth'})}
function renderQuestion(){const q=document.getElementById('quiz');if(currentIndex>=currentQuestions.length){finishQuiz();return}answered=false;const item=currentQuestions[currentIndex];q.innerHTML=`<div class="quiz-q"><div class="question"><div class="qnum">${currentIndex+1}</div><div><small>${selected}</small><h3>${item[0]}</h3></div></div><div>${item[1].map((o,i)=>`<button class="option" onclick="answer(${i})" id="opt${i}"><span class="choice-label">${labels[i]}.</span> ${o}<span class="feedback"></span></button>`).join('')}</div><button id="nextBtn" class="btn primary next-btn" onclick="nextQuestion()" hidden>পরের প্রশ্ন ➜</button></div>`}
function answer(i){if(answered)return;answered=true;const item=currentQuestions[currentIndex];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===item[2]){b.classList.add('selected-correct');b.querySelector('.feedback').textContent='✓'}if(n===i&&i!==item[2]){b.classList.add('selected-wrong');b.querySelector('.feedback').textContent='✕'}});if(i===item[2])score++;document.getElementById('nextBtn').hidden=false}
function nextQuestion(){if(!answered)return;currentIndex++;renderQuestion()}
function finishQuiz(){document.getElementById('quiz').innerHTML='';const total=currentQuestions.length;const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<h2>🎉 কুইজ শেষ!</h2><p><b>বিষয়:</b> ${selected}</p><p><b>স্কোর:</b> ${score}/${total}</p><p>${score===total?'মাশাআল্লাহ! সবগুলো সঠিক।':score>=Math.ceil(total*.7)?'খুব ভালো! আরও একটু চেষ্টা করুন।':'আবার চেষ্টা করুন—ইনশাআল্লাহ আরও ভালো হবে।'}</p><button class="btn primary" onclick="startQuiz()">🔄 আবার কুইজ দিন</button>`;saveResult()}
async function saveResult(){if(!user)return;try{await db.from('quiz_history').insert({user_id:user.id,category:selected,score,total:currentQuestions.length,created_at:new Date().toISOString()})}catch(e){console.log(e)}}
async function init(){try{const {data}=await db.auth.getUser();user=data?.user||null}catch(e){}renderCategories()}
function showTab(t){['quiz','history','badges'].forEach(x=>{document.getElementById(x+'Tab').hidden=x!==t});document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['quiz','history','badges'][i]===t));if(t==='history')loadHistory();if(t==='badges')loadBadges()}
async function loadHistory(){const el=document.getElementById('history');if(!user){el.textContent='লগইন করলে ইতিহাস দেখা যাবে।';return}try{const {data,error}=await db.from('quiz_history').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(error)throw error;el.innerHTML=data?.length?data.map(x=>`<div class="history"><b>${x.category}</b> — ${x.score}/${x.total}<br><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'এখনও কোনো কুইজ ইতিহাস নেই।'}catch(e){el.textContent='ইতিহাস লোড করা যায়নি।'}}
async function loadBadges(){document.getElementById('badges').innerHTML='<span class="badge">🏅 কুইজ শুরুকারী</span>'+(score>=5?'<span class="badge">🌟 ৫+ সঠিক উত্তর</span>':'')}
init();
</script>
</body></html>
