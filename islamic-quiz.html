<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>SOHOCHOR — ইসলামি কুইজ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:820px;margin:auto;padding:16px 12px 90px}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.home-btn{background:linear-gradient(135deg,#08783f,#10a35c);color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:800}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #12372a14}.hero{background:linear-gradient(135deg,#063b27,#08783f);color:#fff}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.94}.selector-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:2px solid #b9ddca;background:linear-gradient(135deg,#f5fff8,#eaf8f0);color:#08783f;border-radius:16px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;text-align:left}.selector-btn small{display:block;font-size:12px;color:#638074;margin-top:3px}.selector-panel{display:none;margin-top:10px;border:2px solid #d8e9df;border-radius:17px;background:#fff;overflow:hidden}.selector-panel.open{display:block}.panel-head{padding:12px;border-bottom:1px solid #e5eee9;background:#f8fcfa}.search{width:100%;padding:12px 14px;border:2px solid #dbe9e1;border-radius:12px;font-size:15px;outline:0}.category-list{max-height:330px;overflow-y:auto;padding:8px}.category-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer}.category-item.active{background:#e8f8ef;border:2px solid #9bd3b4}.cat-icon{font-size:22px;width:28px}.cat-name{font-weight:800}.select-dot{margin-left:auto;width:25px;height:25px;border:2px solid #aac7b8;border-radius:50%;display:grid;place-items:center;color:transparent}.category-item.active .select-dot{background:#08783f;border-color:#08783f;color:#fff}.actions{margin-top:12px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#08783f,#10a35c);color:#fff}.quiz-q{padding:0;border-radius:24px;background:#fff;box-shadow:0 10px 32px #12372a18;margin:14px 0;overflow:hidden}.quiz-head{padding:14px 18px;background:linear-gradient(135deg,#063b27,#08783f);color:#fff;display:flex;justify-content:space-between;align-items:center}.progress{height:7px;background:#dcebe3}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#22b573);transition:.3s}.question{padding:22px 18px 16px;display:flex;gap:13px;align-items:flex-start}.qnum{width:46px;height:46px;min-width:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7b3fd0,#087f8c);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 14px #087f8c30}.question h3{margin:2px 0;font-size:19px;line-height:1.55}.options{padding:0 18px 18px}.option{display:flex;align-items:center;gap:12px;width:100%;margin:11px 0;padding:13px 14px;border:2px solid #e0ebe5;border-radius:17px;background:#fff;text-align:left;font-size:16px;cursor:pointer;transition:.18s;box-shadow:0 3px 10px #12372a08}.option:hover{transform:translateY(-1px);border-color:#a9cfbb}.choice-label{width:42px;height:42px;min-width:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:17px;box-shadow:0 4px 10px #0002}.choice-label.a{background:linear-gradient(135deg,#7b3fd0,#a65eea)}.choice-label.b{background:linear-gradient(135deg,#087f8c,#11a6a8)}.choice-label.c{background:linear-gradient(135deg,#d27b08,#f2a928)}.choice-label.d{background:linear-gradient(135deg,#d6384d,#ef6375)}.option-text{flex:1;font-weight:750}.feedback{font-size:22px;font-weight:1000}.selected-correct{border-color:#18a558!important;background:#e8f9ee!important}.selected-wrong{border-color:#e33!important;background:#fff0f0!important}.next-btn{width:100%;margin-top:4px}.result{padding:22px;text-align:center;background:linear-gradient(135deg,#fff,#effbf4)}.result-score{font-size:38px;font-weight:1000;color:#08783f}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7f3ed;color:#08783f}.tabs button.active{background:#08783f;color:#fff}.history{border-left:5px solid #08783f;padding:10px;margin:8px 0;background:#f3faf6;border-radius:10px}.badge{display:inline-block;border-radius:999px;padding:8px 12px;background:#fff0b8;margin:5px;font-weight:800}.empty{text-align:center;padding:24px;color:#687a71}@media(max-width:520px){.wrap{padding:12px 10px 85px}.hero h1{font-size:24px}.question h3{font-size:17px}}
</style></head>
<body><main class="wrap"><div class="top"><a class="home-btn" href="./">🏠 হোম</a><a class="home-btn" href="all-features.html">☷ ফিচার</a></div>
<section class="card hero"><h1>🕌 ইসলামি কুইজ</h1><p>একটি বিষয় নির্বাচন করুন এবং একটির পর একটি প্রশ্নের উত্তর দিন।</p></section>
<section class="card"><button id="selectorBtn" class="selector-btn" onclick="toggleSelector()"><span>🎯 কুইজের বিষয় নির্বাচন করুন<small id="selectedText">একটি বিষয় নির্বাচন করুন</small></span><span id="arrow">⌄</span></button><div id="selectorPanel" class="selector-panel"><div class="panel-head"><input id="search" class="search" placeholder="🔎 বিষয় খুঁজুন..." oninput="renderCategories()"></div><div id="categoryList" class="category-list"></div></div><div class="actions"><button class="btn primary" onclick="startQuiz()">🚀 কুইজ শুরু করুন</button></div></section>
<section class="card"><div class="tabs"><button class="active" onclick="showTab('quiz')">📝 Quiz</button><button onclick="showTab('history')">📊 History</button><button onclick="showTab('badges')">🏅 Badge</button></div></section>
<section id="quizTab"><div id="quiz"></div><div id="result" class="card result" hidden></div></section><section id="historyTab" class="card" hidden><h2>📊 Quiz History</h2><div id="history">লগইন করলে ইতিহাস দেখা যাবে।</div></section><section id="badgesTab" class="card" hidden><h2>🏅 আমার Badge</h2><div id="badges">লগইন করলে Badge দেখা যাবে।</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');let user=null,currentQuestions=[],selected=null,currentIndex=0,score=0,answered=false;const labels=['ক','খ','গ','ঘ'];
const categories=[['🟢','সব ইসলামি কুইজ'],['🕌','দ্বীন'],['📖','কুরআন'],['📜','হাদিস'],['🕋','সীরাত'],['👳','সাহাবায়ে কেরাম'],['👩','সাহাবিয়াত'],['🌟','নবী-রাসূল'],['🧠','আকিদাহ'],['⚖️','ফিকহ'],['🧎','নামাজ'],['🌙','রোজা'],['💰','যাকাত'],['🕋','হজ ও উমরাহ'],['🤲','দোয়া ও যিকির'],['📿','তাসবিহ'],['❤️','আখলাক ও চরিত্র'],['👨‍👩‍👧','পরিবার ও ইসলাম'],['🕌','মসজিদ'],['📅','ইসলামি মাস ও তারিখ'],['🌙','রমজান'],['🐑','কুরবানি'],['📚','ইসলামি ইতিহাস'],['⚔️','ইসলামের যুদ্ধ ও অভিযান'],['🏛️','ইসলামি সভ্যতা'],['🗣️','আরবি ও কুরআনিক শব্দ'],['📜','তাফসির'],['🌟','দাওয়াহ'],['🟢','জামায়াতে ইসলামী'],['☪️','মিশ্র ইসলামি']];
const bank={'দ্বীন':[['ইসলামের প্রথম স্তম্ভ কোনটি?',['শাহাদাহ','সালাত','সাওম','যাকাত'],0],['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2]],'কুরআন':[['পবিত্র কুরআন কোন ভাষায় নাজিল হয়েছে?',['আরবি','ফারসি','উর্দু','বাংলা'],0],['কুরআনের প্রথম সূরা কোনটি?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1]],'রোজা':[['সাওম বলতে কী বোঝায়?',['হজ','রোজা','যাকাত','সদকা'],1],['রমজানের রোজা ইসলামের কোন স্তম্ভ?',['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ'],2]],'নামাজ':[['প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0]],'হজ ও উমরাহ':[['হজ কোন শহরে প্রধানত অনুষ্ঠিত হয়?',['মদিনা','মক্কা','জেরুজালেম','কায়রো'],1]],'যাকাত':[['যাকাত সাধারণত কোন সম্পদের ওপর ফরজ হয়?',['নিসাব পরিমাণ যোগ্য সম্পদ','শুধু খাবার','শুধু পোশাক','শুধু বই'],0]],'মিশ্র ইসলামি':[['ইমানের মৌলিক বিষয়গুলোর একটি কোনটি?',['আখিরাতে বিশ্বাস','শুধু ব্যবসা','শুধু ভ্রমণ','শুধু খেলাধুলা'],0],['মুসলমানদের সাপ্তাহিক বিশেষ জামাতের দিন কোনটি?',['সোমবার','বুধবার','শুক্রবার','রবিবার'],2]]};const fallback=[['ইসলামের একটি গুরুত্বপূর্ণ ইবাদত কোনটি?',['সালাত','খেলাধুলা','ভ্রমণ','ব্যবসা'],0],['মুসলমানদের পবিত্র কিতাব কোনটি?',['কুরআন','ইতিহাস','কবিতা','উপন্যাস'],0]];
function toggleSelector(){const p=document.getElementById('selectorPanel');p.classList.toggle('open');document.getElementById('arrow').textContent=p.classList.contains('open')?'⌃':'⌄';if(p.classList.contains('open'))renderCategories()}function renderCategories(){const q=(document.getElementById('search').value||'').trim();document.getElementById('categoryList').innerHTML=categories.filter(c=>!q||c[1].includes(q)).map(c=>`<div class="category-item ${selected===c[1]?'active':''}" onclick="chooseCategory('${c[1].replace(/'/g,"\\'")}')"><span class="cat-icon">${c[0]}</span><span class="cat-name">${c[1]}</span><span class="select-dot">✓</span></div>`).join('')||'<div class="empty">কোনো বিষয় পাওয়া যায়নি</div>'}function chooseCategory(n){selected=n;document.getElementById('selectedText').textContent='নির্বাচিত: '+n;document.getElementById('selectorPanel').classList.remove('open');document.getElementById('arrow').textContent='⌄'}
function startQuiz(){if(!selected){alert('আগে একটি বিষয় নির্বাচন করুন।');toggleSelector();return}currentIndex=0;score=0;answered=false;const source=selected==='সব ইসলামি কুইজ'?Object.values(bank).flat():(bank[selected]||fallback);currentQuestions=[...source].sort(()=>Math.random()-.5);document.getElementById('result').hidden=true;showTab('quiz');renderQuestion();window.scrollTo({top:document.getElementById('quiz').offsetTop-20,behavior:'smooth'})}
function renderQuestion(){if(currentIndex>=currentQuestions.length){finishQuiz();return}answered=false;const item=currentQuestions[currentIndex];document.getElementById('quiz').innerHTML=`<div class="quiz-q"><div class="quiz-head"><b>🧠 প্রশ্ন ${currentIndex+1}/${currentQuestions.length}</b><b>⭐ ${score} পয়েন্ট</b></div><div class="progress"><i style="width:${((currentIndex)/currentQuestions.length)*100}%"></i></div><div class="question"><div class="qnum">${currentIndex+1}</div><div><small>${selected}</small><h3>${item[0]}</h3></div></div><div class="options">${item[1].map((o,i)=>`<button class="option" onclick="answer(${i})" id="opt${i}"><span class="choice-label ${['a','b','c','d'][i]}">${labels[i]}</span><span class="option-text">${o}</span><span class="feedback"></span></button>`).join('')}<button id="nextBtn" class="btn primary next-btn" onclick="nextQuestion()" hidden>পরের প্রশ্ন ➜</button></div></div>`}
function answer(i){if(answered)return;answered=true;const item=currentQuestions[currentIndex];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===item[2]){b.classList.add('selected-correct');b.querySelector('.feedback').textContent='✓'}if(n===i&&i!==item[2]){b.classList.add('selected-wrong');b.querySelector('.feedback').textContent='✕'}});if(i===item[2])score++;document.getElementById('nextBtn').hidden=false}function nextQuestion(){if(answered){currentIndex++;renderQuestion()}}function finishQuiz(){document.getElementById('quiz').innerHTML='';const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<h2>🎉 কুইজ সম্পন্ন!</h2><div class="result-score">${score}/${currentQuestions.length}</div><p><b>${selected}</b></p><p>${score===currentQuestions.length?'মাশাআল্লাহ! অসাধারণ!':'খুব ভালো! আরও অনুশীলন করুন।'}</p><button class="btn primary" onclick="startQuiz()">🔄 আবার কুইজ দিন</button>`;saveResult()}async function saveResult(){if(!user)return;try{await db.from('quiz_history').insert({user_id:user.id,category:selected,score,total:currentQuestions.length,created_at:new Date().toISOString()})}catch(e){console.log(e)}}async function init(){try{const{data}=await db.auth.getUser();user=data?.user||null}catch(e){}renderCategories()}function showTab(t){['quiz','history','badges'].forEach(x=>document.getElementById(x+'Tab').hidden=x!==t);document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['quiz','history','badges'][i]===t));if(t==='history')loadHistory();if(t==='badges')loadBadges()}async function loadHistory(){const el=document.getElementById('history');if(!user){el.textContent='লগইন করলে ইতিহাস দেখা যাবে।';return}try{const{data,error}=await db.from('quiz_history').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(error)throw error;el.innerHTML=data?.length?data.map(x=>`<div class="history"><b>${x.category}</b> — ${x.score}/${x.total}<br><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'এখনও কোনো কুইজ ইতিহাস নেই।'}catch(e){el.textContent='ইতিহাস লোড করা যায়নি।'}}async function loadBadges(){document.getElementById('badges').innerHTML='<span class="badge">🏅 কুইজ শুরুকারী</span>'+(score>=5?'<span class="badge">🌟 ৫+ সঠিক উত্তর</span>':'')}init();
</script></body></html>
