<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b13"><title>Digital Tasbih — SOHOCHOR</title><style>*{box-sizing:border-box}body{margin:0;background:#07140f;color:#eef8f2;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.app{max-width:620px;margin:auto;padding:12px 12px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{color:#b8f2cf;text-decoration:none;font-weight:800}.brand{font-size:12px;opacity:.7}.hero{background:linear-gradient(145deg,#0d3a28,#09251b);border:1px solid #245b43;border-radius:24px;padding:18px 14px;text-align:center;box-shadow:0 12px 35px #0005}.hero h1{margin:0;font-size:25px}.sub{font-size:12px;opacity:.7}.dial{width:205px;height:205px;margin:18px auto 14px;border-radius:50%;padding:10px;background:conic-gradient(#56d89a var(--p),#173b2c 0);box-shadow:0 0 0 8px #0b2118,0 10px 35px #0006;cursor:pointer;touch-action:manipulation}.dial-inner{height:100%;border-radius:50%;background:#061810;display:flex;flex-direction:column;align-items:center;justify-content:center}.number{font-size:58px;font-weight:950}.of{font-size:14px;opacity:.65}.hint{font-size:13px;color:#9ee8bf;font-weight:800}.targetbar,.quick,.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.targetbar button,.quick button,.tools button{border:1px solid #315b48;background:#0d2119;color:#dff7e9;border-radius:13px;padding:9px 10px;font-weight:800;flex:1}.targetbar button.active,.quick button.active{background:#56d89a;color:#062116}.custom{display:flex;gap:6px;margin-top:8px}.custom input{width:100%;background:#061810;color:#fff;border:1px solid #315b48;border-radius:12px;padding:9px}.name{font-size:22px;font-weight:900;margin-top:12px}.arabic{font-size:24px;color:#d4f3df;line-height:1.7}.done{min-height:21px;color:#7ff0b4;font-weight:900;margin-top:7px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.card{border:1px solid #244b3a;background:#0c2018;border-radius:14px;padding:10px;text-align:center}.card small{display:block;opacity:.6}.card b{font-size:20px}.lock{margin-top:10px;width:100%;border:1px solid #315b48;background:#10271e;color:#d9f5e5;border-radius:13px;padding:10px;font-weight:900}.reset{color:#ffd2d2!important;border-color:#694141!important}.tip{text-align:center;font-size:11px;opacity:.55;margin-top:12px}@media(max-width:450px){.dial{width:190px;height:190px}}
</style></head><body><main class="app"><div class="top"><a class="back" href="index.html">← হোম</a><span class="brand">SOHOCHOR • DIGITAL TASBIH</span></div><section class="hero"><h1>📿 Digital Tasbih</h1><div class="sub">লক্ষ্য পূর্ণ হলে কাউন্টার আর বাড়বে না</div><div class="dial" id="dial"><div class="dial-inner"><div class="number" id="num">০</div><div class="of" id="of">/ ৩৩</div></div></div><div class="hint">👆 এখানে চাপুন</div><div class="targetbar" id="targets"></div><div class="custom"><input id="custom" type="number" min="1" max="999999" placeholder="Custom লক্ষ্য লিখুন"><button id="setCustom">✓ সেট</button></div><div class="name" id="name"></div><div class="arabic" id="arabic"></div><div class="done" id="done"></div><div class="quick" id="quick"></div></section><section class="cards"><div class="card"><small>আজকের মোট</small><b id="total">০</b></div><div class="card"><small>বর্তমান লক্ষ্য</small><b id="targetText">৩৩</b></div></section><div class="tools"><button id="sound">🔊 শব্দ: চালু</button><button id="vibe">📳 ভাইব্রেশন: চালু</button></div><button class="lock" id="lock">🔒 কাউন্টার লক: বন্ধ</button><div class="tools"><button class="reset" id="reset">↺ বর্তমান রিসেট</button><button id="allReset">⟳ সব রিসেট</button></div><div class="tip">লক্ষ্য পূর্ণ হলে হালকা টোন + ভাইব্রেশন হবে। লক চালু থাকলে দুর্ঘটনাজনিত ট্যাপ বন্ধ থাকবে।</div></main><script>const zikrs=[['সুবহানাল্লাহ','سُبْحَانَ اللَّهِ'],['আলহামদুলিল্লাহ','الْحَمْدُ لِلَّهِ'],['আল্লাহু আকবার','اللَّهُ أَكْبَرُ'],['লা ইলাহা ইল্লাল্লাহ','لَا إِلٰهَ إِلَّا اللَّهُ'],['আস্তাগফিরুল্লাহ','أَسْتَغْفِرُ اللَّهُ'],['দরুদ শরীফ','اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ']];const opts=[33,100,300,500,1000],key='sohochor_tasbih_v2';let s=JSON.parse(localStorage.getItem(key)||'{}'),target=Number(s.target||33),current=Number(s.current||0),sound=s.sound!==false,vibe=s.vibe!==false,locked=s.locked===true;const $=x=>document.getElementById(x),bn=n=>Number(n).toLocaleString('bn-BD');function save(){s.target=target;s.current=current;s.sound=sound;s.vibe=vibe;s.locked=locked;s.active=Number(s.active||0);localStorage.setItem(key,JSON.stringify(s))}function ai(){return Number(s.active||0)}function total(){return zikrs.reduce((a,_,i)=>a+Number(s['c'+i]||0),0)}function tone(){if(!sound)return;try{let A=AudioContext||webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}function doneTone(){tone();if(vibe)try{navigator.vibrate&&navigator.vibrate([180,70,180,70,350])}catch(e){}}function render(){let i=ai(),z=zikrs[i];$('name').textContent=z[0];$('arabic').textContent=z[1];$('num').textContent=bn(current);$('of').textContent='/ '+bn(target);$('targetText').textContent=bn(target);$('total').textContent=bn(total());$('dial').style.setProperty('--p',Math.min(current/target*100,100)+'%');$('done').textContent=current>=target?'✓ লক্ষ্য পূর্ণ — আর গণনা হবে না':'';$('targets').innerHTML=opts.map(x=>`<button class="${x===target?'active':''}">${bn(x)}</button>`).join('');$('targets').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>setTarget(opts[i]));$('quick').innerHTML=zikrs.map((x,j)=>`<button class="${j===i?'active':''}">${x[0]}</button>`).join('');$('quick').querySelectorAll('button').forEach((b,j)=>b.onclick=()=>setZikr(j));$('sound').textContent='🔊 শব্দ: '+(sound?'চালু':'বন্ধ');$('vibe').textContent='📳 ভাইব্রেশন: '+(vibe?'চালু':'বন্ধ');$('lock').textContent='🔒 কাউন্টার লক: '+(locked?'চালু':'বন্ধ')}function setZikr(i){if(locked)return;s.active=i;current=Number(s['c'+i]||0);save();render()}function setTarget(x){if(locked)return;target=Math.max(1,Math.floor(x));current=Math.min(Number(s['c'+ai()]||0),target);save();render()}function tap(){if(locked)return;if(current>=target){doneTone();return}current++;s['c'+ai()]=current;save();tone();if(vibe)try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}if(current===target)doneTone();render()}$('dial').onclick=tap;$('sound').onclick=()=>{sound=!sound;save();render()};$('vibe').onclick=()=>{vibe=!vibe;save();render()};$('lock').onclick=()=>{locked=!locked;save();render()};$('reset').onclick=()=>{if(locked)return;current=0;s['c'+ai()]=0;save();render()};$('allReset').onclick=()=>{if(locked)return;if(confirm('সব তসবীহের হিসাব রিসেট করবেন?')){zikrs.forEach((_,i)=>s['c'+i]=0);current=0;save();render()}};$('setCustom').onclick=()=>{if(locked)return;let x=Number($('custom').value);if(x>=1&&x<=999999)setTarget(x);$('custom').value=''};render();</script></body></html>
