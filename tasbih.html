<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b13">
<title>Digital Tasbih — SOHOCHOR</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="theme.css?v=6">
<style>
*{box-sizing:border-box}body{margin:0;background:#07140f;color:#eef8f2;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.app{max-width:620px;margin:auto;padding:12px 12px 28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.back{color:#b8f2cf;text-decoration:none;font-weight:800}.brand{font-size:12px;opacity:.7}.hero{background:linear-gradient(145deg,#0d3a28,#09251b);border:1px solid #245b43;border-radius:24px;padding:18px 14px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.3)}.hero h1{margin:0;font-size:25px}.subtitle{font-size:12px;opacity:.7;margin-top:4px}.dial{width:205px;height:205px;margin:18px auto 14px;border-radius:50%;padding:10px;background:conic-gradient(#56d89a var(--p),#173b2c 0);box-shadow:0 0 0 8px #0b2118,0 10px 35px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}.dial:active{transform:scale(.97)}.dial-inner{height:100%;border-radius:50%;background:#061810;display:flex;flex-direction:column;align-items:center;justify-content:center}.number{font-size:58px;line-height:1;font-weight:950;letter-spacing:-2px}.of{font-size:14px;opacity:.65;margin-top:6px}.tap-hint{font-size:13px;color:#9ee8bf;font-weight:800;margin-top:8px}.targetbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.targetbar button{border:1px solid #315b48;background:#10271e;color:#d9f5e5;border-radius:20px;padding:7px 12px;font-weight:800}.targetbar button.active{background:#56d89a;color:#062116;border-color:#56d89a}.zikrname{font-size:22px;font-weight:900;margin-top:12px}.arabic{font-size:24px;line-height:1.7;color:#d4f3df}.quick{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.quick button{flex:1 1 30%;border:1px solid #315b48;background:#0d2119;color:#dff7e9;border-radius:13px;padding:10px 5px;font-weight:800}.quick button.active{border-color:#56d89a;color:#56d89a}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.card{border:1px solid #244b3a;background:#0c2018;border-radius:14px;padding:10px;text-align:center}.card small{display:block;opacity:.6}.card b{font-size:20px}.tools{display:flex;gap:8px;margin-top:10px}.tools button{flex:1;border:1px solid #315b48;background:#0d2119;color:#e7f8ee;border-radius:12px;padding:10px;font-weight:800}.reset{color:#ffd2d2!important;border-color:#694141!important}.done{min-height:20px;color:#7ff0b4;font-size:13px;font-weight:800;margin-top:6px}.tip{text-align:center;font-size:11px;opacity:.55;margin-top:12px}
</style>
</head>
<body>
<main class="app">
<div class="top"><a class="back" href="index.html">← হোম</a><span class="brand">SOHOCHOR • DIGITAL TASBIH</span></div>
<section class="hero">
<h1>📿 Digital Tasbih</h1><div class="subtitle">কাউন্টারের উপর চাপলেই পাঠ গণনা হবে</div>
<div class="dial" id="dial" role="button" aria-label="তসবীহ কাউন্টার"><div class="dial-inner"><div class="number" id="num">০</div><div class="of" id="of">/ ৩৩</div></div></div>
<div class="tap-hint">👆 এখানে চাপুন</div>
<div class="targetbar" id="targets"></div>
<div class="zikrname" id="name"></div><div class="arabic" id="arabic"></div>
<div class="done" id="done"></div>
<div class="quick" id="quick"></div>
</section>
<section class="cards"><div class="card"><small>আজকের মোট</small><b id="total">০</b></div><div class="card"><small>বর্তমান লক্ষ্য</small><b id="targetText">৩৩</b></div></section>
<div class="tools"><button id="sound">🔊 শব্দ: চালু</button><button id="vibe">📳 ভাইব্রেশন: চালু</button></div>
<div class="tools"><button class="reset" id="reset">↺ বর্তমান রিসেট</button><button id="allReset">⟳ সব রিসেট</button></div>
<div class="tip">লক্ষ্য পূর্ণ হলে হালকা টোন ও ভাইব্রেশন হবে।</div>
</main>
<script>
const zikrs=[['সুবহানাল্লাহ','سُبْحَانَ اللَّهِ'],['আলহামদুলিল্লাহ','الْحَمْدُ لِلَّهِ'],['আল্লাহু আকবার','اللَّهُ أَكْبَرُ'],['লা ইলাহা ইল্লাল্লাহ','لَا إِلٰهَ إِلَّا اللَّهُ'],['আস্তাগফিরুল্লাহ','أَسْتَغْفِرُ اللَّهُ'],['দরুদ শরীফ','اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ']];
const opts=[33,100,500,1000],key='sohochor_tasbih_v1';let s=JSON.parse(localStorage.getItem(key)||'{}');let target=Number(s.target||33),current=Number(s.current||0),sound=s.sound!==false,vibe=s.vibe!==false;
function bn(n){return Number(n).toLocaleString('bn-BD')}
function save(){s.target=target;s.current=current;s.sound=sound;s.vibe=vibe;s.active=s.active||0;localStorage.setItem(key,JSON.stringify(s))}
function active(){return Number(s.active||0)}
function vibrate(){if(!vibe)return;try{if(navigator.vibrate)navigator.vibrate([80,40,80])}catch(e){}}
function tone(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function completeTone(){if(sound)tone();if(vibe)try{navigator.vibrate&&navigator.vibrate([180,70,180,70,350])}catch(e){}}
function total(){return zikrs.reduce((a,_,i)=>a+Number(s['c'+i]||0),0)}
function render(){const i=active(),z=zikrs[i];document.getElementById('name').textContent=z[0];document.getElementById('arabic').textContent=z[1];document.getElementById('num').textContent=bn(current);document.getElementById('of').textContent='/ '+bn(target);document.getElementById('targetText').textContent=bn(target);document.getElementById('dial').style.setProperty('--p',Math.min(current/target*100,100)+'%');document.getElementById('total').textContent=bn(total());document.getElementById('done').textContent=current>=target?'✓ লক্ষ্য পূর্ণ — আবার কাউন্টারে চাপলে সতর্কতা হবে':'';document.getElementById('targets').innerHTML=opts.map(x=>`<button class="${x===target?'active':''}" onclick="setTarget(${x})">${bn(x)}</button>`).join('');document.getElementById('quick').innerHTML=zikrs.map((x,j)=>`<button class="${j===i?'active':''}" onclick="setZikr(${j})">${x[0]}</button>`).join('');document.getElementById('sound').textContent='🔊 শব্দ: '+(sound?'চালু':'বন্ধ');document.getElementById('vibe').textContent='📳 ভাইব্রেশন: '+(vibe?'চালু':'বন্ধ')}
function setZikr(i){s.active=i;current=Number(s['c'+i]||0);save();render()}
function setTarget(x){target=x;current=Math.min(Number(s['c'+active()]||0),target);save();render()}
function tap(){if(current>=target){completeTone();return}current++;s['c'+active()]=current;save();tone();vibrate();render()}
function resetCurrent(){current=0;s['c'+active()]=0;save();render()}
function resetAll(){if(confirm('সব তসবীহের হিসাব রিসেট করবেন?')){zikrs.forEach((_,i)=>s['c'+i]=0);current=0;save();render()}}
document.getElementById('dial').addEventListener('click',tap);document.getElementById('reset').addEventListener('click',resetCurrent);document.getElementById('allReset').addEventListener('click',resetAll);document.getElementById('sound').addEventListener('click',()=>{sound=!sound;save();render()});document.getElementById('vibe').addEventListener('click',()=>{vibe=!vibe;save();render()});
let pressTimer;document.getElementById('dial').addEventListener('pointerdown',()=>{pressTimer=setTimeout(()=>{if(current<target){tap()}},650)});['pointerup','pointercancel','pointerleave'].forEach(e=>document.getElementById('dial').addEventListener(e,()=>clearTimeout(pressTimer)));
render();
</script>
</body>
</html>
