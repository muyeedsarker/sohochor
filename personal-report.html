<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>Personal Report Book — SOHOCHOR</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#183b2b;margin:0}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bccac1;border-radius:9px;font:inherit}textarea{min-height:150px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#08783f;color:#fff;font-weight:700}.danger{background:#a22}.item{border-top:1px solid #ddd;padding:12px 0}.small{font-size:13px;color:#68736d}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><a href="index.html">← হোম</a><section class="card"><h1>📊 Personal Report Book</h1><p class="small">ব্যক্তিগত রিপোর্ট এই ডিভাইসের ব্রাউজারে স্থানীয়ভাবে সংরক্ষিত থাকে। অন্য ব্যবহারকারীর জন্য প্রকাশ করা হয় না।</p><div class="grid"><div><label>তারিখ</label><input id="date" type="date"></div><div><label>শিরোনাম</label><input id="title" placeholder="রিপোর্টের শিরোনাম"></div><div class="full"><label>রিপোর্ট</label><textarea id="text" placeholder="আপনার ব্যক্তিগত রিপোর্ট লিখুন..."></textarea></div></div><br><button class="btn" onclick="save()">💾 Save Report</button> <button class="btn" onclick="clearForm()">নতুন</button></section><section class="card"><input id="search" placeholder="🔎 রিপোর্ট Search" oninput="render()"><div id="list"></div></section></main><script>const K='sohochor_personal_reports_v1';let data=JSON.parse(localStorage.getItem(K)||'[]'),editId=null;function save(){let d=date.value,t=title.value.trim(),x=text.value.trim();if(!d||!t||!x)return alert('তারিখ, শিরোনাম ও রিপোর্ট পূরণ করুন');if(editId){let n=data.find(n=>n.id===editId);Object.assign(n,{date:d,title:t,text:x,updated:Date.now()})}else data.unshift({id:Date.now(),date:d,title:t,text:x,updated:Date.now()});localStorage.setItem(K,JSON.stringify(data));clearForm();render()}function edit(id){let n=data.find(n=>n.id===id);editId=id;date.value=n.date;title.value=n.title;text.value=n.text;scrollTo({top:0,behavior:'smooth'})}function del(id){if(confirm('এই রিপোর্ট মুছে ফেলবেন?')){data=data.filter(n=>n.id!==id);localStorage.setItem(K,JSON.stringify(data));render()}}function clearForm(){editId=null;date.value='';title.value='';text.value=''}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=search.value.toLowerCase(),a=data.filter(n=>(n.title+' '+n.text).toLowerCase().includes(q));list.innerHTML=a.length?a.map(n=>`<article class="item"><b>${esc(n.title)}</b><div class="small">${esc(n.date)}</div><p>${esc(n.text).replace(/\n/g,'<br>')}</p><button class="btn" onclick="edit(${n.id})">Edit</button> <button class="btn danger" onclick="del(${n.id})">Delete</button></article>`).join(''):'<p class="small">কোনো রিপোর্ট নেই।</p>'}render();</script></body></html>
