<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>ইসলামি সার্চ — SOHOCHOR</title><style>body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4faf7;color:#17382b}.wrap{max-width:900px;margin:auto;padding:18px 14px 70px}.top{display:flex;justify-content:space-between}.btn{background:#087a4a;color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:900}.hero{margin-top:14px;background:linear-gradient(135deg,#063b27,#0b8150);color:#fff;border-radius:24px;padding:24px}.search{width:100%;box-sizing:border-box;margin-top:14px;padding:15px;border:0;border-radius:15px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.item{display:block;background:#fff;border:1px solid #dbe9e1;border-radius:17px;padding:16px;text-decoration:none;color:inherit;box-shadow:0 7px 20px #17382b0b}.item b{display:block;margin-bottom:5px}.item small{color:#6b7d74}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="btn" href="index.html">🏠 হোম</a><a class="btn" href="all-features.html">☷ ফিচার</a></div><section class="hero"><h1>🔎 ইসলামি সার্চ</h1><p>কুরআন, হাদিস, দোয়া, ফিকহ, শিক্ষা ও সহচরের ইসলামি বিভাগ দ্রুত খুঁজুন।</p><input id="q" class="search" placeholder="যেমন: নামাজ, রোজা, দোয়া, কুরআন..."></section><div id="results" class="grid"></div></main><script>const data=[['📖','কুরআন','কুরআন পড়া ও শেখা','quran.html'],['📜','হাদিস','হাদিসের বই ও বিষয়','hadith-books.html'],['🤲','দোয়া ও যিকির','দৈনন্দিন দোয়া','duas.html'],['🕌','নামাজ','নামাজ শিক্ষা ও সময়','prayer.html'],['🕐','নামাজের সময়','স্থানভিত্তিক সময়সূচি','prayer-times.html'],['🧭','কিবলা','কিবলা ফাইন্ডার','qibla.html'],['🧠','ইসলামি কুইজ','বিষয়ভিত্তিক কুইজ','islamic-quiz.html'],['📅','ইসলামি ক্যালেন্ডার','হিজরি তারিখ','islamic-calendar.html'],['🌙','রমজান','রমজানের সহায়িকা','ramadan.html'],['🕋','হজ ও উমরাহ','হজ-উমরাহ গাইড','hajj-umrah.html'],['📚','ইসলামি বই','ইসলামি বই ও সাহিত্য','islamic-books.html'],['🔤','আরবি কায়দা','আরবি শেখা','arabic-qaida.html'],['👨‍👩‍👧','পরিবার ও ইসলাম','পরিবারভিত্তিক ইসলামি শিক্ষা','family-islam.html'],['👶','শিশু শিক্ষা','শিশুদের ইসলামি শিক্ষা','children-islam.html'],['🌿','আখলাক','চরিত্র ও আত্মশুদ্ধি','akhlaq.html'],['⚖️','মাসআলা','দৈনন্দিন ফিকহ বিষয়','masala.html']];const out=document.getElementById('results');function render(){const q=document.getElementById('q').value.trim().toLowerCase();const rows=data.filter(x=>!q||(x[1]+x[2]).toLowerCase().includes(q));out.innerHTML=rows.map(x=>`<a class="item" href="${x[3]}"><b>${x[0]} ${x[1]}</b><small>${x[2]}</small></a>`).join('')||'<div class="item">কোনো বিভাগ পাওয়া যায়নি।</div>'}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
