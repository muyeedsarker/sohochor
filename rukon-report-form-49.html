<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>রুকন রিপোর্ট বই</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;color:#183b2b}.wrap{max-width:850px;margin:auto;padding:16px}.sheet{background:#fff;padding:20px;border-radius:16px;box-shadow:0 2px 10px #0001}h1{text-align:center;font-size:21px;margin:4px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-weight:700}input,textarea{font:inherit;padding:11px;border:1px solid #b9c9c0;border-radius:8px;box-sizing:border-box}textarea{min-height:90px;resize:vertical}.footer{margin-top:20px;text-align:center}.print{padding:10px 16px;border:0;border-radius:9px;background:#08783f;color:white;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}}@media print{body{background:white}.sheet{box-shadow:none}.print{display:none}}</style></head><body><main class="wrap"><section class="sheet"><h1>রুকন রিপোর্ট বই</h1><div class="grid"><div class="field full"><label>নাম</label><input></div><div class="field"><label>দাওয়াতি টার্গেট</label><input></div><div class="field"><label>কর্মী টার্গেট</label><input></div><div class="field"><label>সদস্য (রুকন) টার্গেট</label><input></div><div class="field full"><label>প্রয়োজনীয় নোট</label><textarea></textarea></div><div class="field"><label>টার্গেটভুক্তকরণের তারিখ</label><input type="date"></div><div class="field"><label>যোগাযোগের তারিখ</label><input type="date"></div><div class="field full"><label>তারিখ</label><input type="date"></div><div class="field full"><label>স্বাক্ষর</label><input></div><div class="field full"><label>দায়িত্বশীলের মন্তব্য:</label><textarea></textarea></div></div><div class="footer"><button class="print" onclick="window.print()">🖨️ প্রিন্ট</button></div></section></main></body></html>
