<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR — Qibla Finder</title><style>body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#eef8ff,#fff8e8,#f2fff5);color:#17352b}.wrap{max-width:700px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 6px 22px #0002}.hero{background:linear-gradient(135deg,#08783f,#1261a0,#7b3fc7);color:#fff}.home{display:inline-block;background:#fff;color:#08783f;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:800;margin-bottom:10px}.compass{width:240px;height:240px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,#fff 0 58%,#dff3e8 59% 60%,#08783f 61% 63%,#fff 64%);box-shadow:0 8px 25px #0003;position:relative;display:flex;align-items:center;justify-content:center}.needle{font-size:70px;transition:transform .25s}.degree{text-align:center;font-size:24px;font-weight:800}.btn{border:0;border-radius:999px;padding:12px 17px;background:#08783f;color:#fff;font-weight:800;cursor:pointer}.ok{color:#08783f;font-weight:800}.warn{color:#a65b00;font-weight:800}</style></head><body><main class="wrap"><a class="home" href="index.html">🏠 Home</a><section class="hero"><h1>🧭 Qibla Finder</h1><p>প্রথমে Mobile Sensor পরীক্ষা, তারপর Qibla Compass।</p></section><section class="card"><h2>📱 Sensor Test</h2><p id="status" class="warn">Sensor পরীক্ষা করা হয়নি।</p><button class="btn" onclick="startSensor()">🧭 Sensor চালু করুন</button><p class="degree" id="heading">—°</p></section><section class="card"><h2>🕋 Qibla Direction</h2><div class="compass"><div id="needle" class="needle">⬆️</div></div><p id="qibla" class="degree">Qibla: —°</p><p class="warn">⚠️ ফোনের compass sensor-এর accuracy ও আশেপাশের magnetic interference-এর কারণে দিক কিছুটা ভিন্ন হতে পারে।</p></section></main><script>const KAABA_LAT=21.4225,KAABA_LON=39.8262;let heading=0,qibla=0;function bearing(lat,lon){const p=Math.PI/180,la1=lat*p,la2=KAABA_LAT*p,d=(KAABA_LON-lon)*p;return (Math.atan2(Math.sin(d),Math.cos(la1)*Math.tan(la2)-Math.sin(la1)*Math.cos(d))/p+360)%360}function update(){needle.style.transform=`rotate(${qibla-heading}deg)`;headingEl.textContent=`${Math.round(heading)}°`;qiblaEl.textContent=`Qibla: ${Math.round(qibla)}°`;}const headingEl=document.getElementById('heading'),qiblaEl=document.getElementById('qibla');async function startSensor(){if(!('geolocation'in navigator)){status.textContent='এই ফোনে Location পাওয়া যাচ্ছে না।';return}navigator.geolocation.getCurrentPosition(pos=>{qibla=bearing(pos.coords.latitude,pos.coords.longitude);status.textContent='Location পাওয়া গেছে। Sensor পরীক্ষা চলছে...';status.className='ok';listen();},()=>{status.textContent='Location permission দিন, তারপর আবার চেষ্টা করুন।'});}function listen(){const C=window.DeviceOrientationEvent;if(!C){status.textContent='এই browser-এ orientation sensor নেই।';return}const run=()=>window.addEventListener('deviceorientationabsolute',eventHandler,true);if(typeof C.requestPermission==='function'){C.requestPermission().then(x=>x==='granted'?run():status.textContent='Sensor permission দেওয়া হয়নি।').catch(()=>{});}else run();}function eventHandler(e){let h;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&typeof e.alpha==='number')h=(360-e.alpha)%360;else return;heading=h;update();status.textContent='✅ Compass sensor সক্রিয়।';status.className='ok'}update();</script></body></html>
