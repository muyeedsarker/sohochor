<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><link rel="stylesheet" href="theme.css?v=6"><title>SOHOCHOR — Member Directory</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.wrap{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #0002}.hero{background:linear-gradient(135deg,#08783f,#12a866,#1261a0);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}input,select{width:100%;box-sizing:border-box;padding:12px;border:2px solid #b7d9c8;border-radius:12px;font-size:16px}.member{background:#fff;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 4px 15px #0002;border-left:6px solid #08783f}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}.green{background:#08783f;color:#fff}.home{display:inline-block;background:#fff;color:#08783f;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:800;margin-bottom:10px}.privacy{font-size:12px;color:#6b756f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions a{padding:8px 11px;border-radius:10px;text-decoration:none;font-weight:800}.call{background:#dff5e8;color:#08783f}.wa{background:#e0f7e9;color:#08783f}.empty{color:#68756e;text-align:center;padding:18px}</style></head><body><main class="wrap"><a class="home" href="index.html">🏠 Home</a><section class="hero"><h1>☎️ Member Directory</h1><p>অনুমোদিত সদস্যদের প্রয়োজনীয় যোগাযোগ তথ্য।</p></section><section class="card"><div class="grid"><input id="q" placeholder="🔎 নাম/দায়িত্ব দিয়ে খুঁজুন" oninput="render()"><select id="privacy" onchange="render()"><option value="all">সব সদস্য</option><option value="call">Call অনুমোদিত</option><option value="whatsapp">WhatsApp অনুমোদিত</option></select></div></section><section><div id="list"><div class="empty">লোড হচ্ছে...</div></div></section></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');let user=null,members=[];async function init(){const {data}=await db.auth.getSession();if(!data.session){location.href='auth.html';return}user=data.session.user;const r=await db.from('profiles').select('id,full_name,role_title,mobile,whatsapp,allow_call,allow_whatsapp').eq('directory_visible',true).order('full_name');if(r.error){list.innerHTML='<div class="empty">Member Directory database এখনো প্রস্তুত নয়।</div>';return}members=r.data||[];render()}function render(){const t=q.value.trim().toLowerCase(),p=privacy.value;let x=members.filter(m=>(!t||`${m.full_name||''} ${m.role_title||''}`.toLowerCase().includes(t))&&(p==='all'||(p==='call'&&m.allow_call)||(p==='whatsapp'&&m.allow_whatsapp)));list.innerHTML=x.length?x.map(m=>`<article class="member"><h3>👤 ${esc(m.full_name||'নাম নেই')}</h3><b>${esc(m.role_title||'সদস্য')}</b><p class="privacy">🔒 Privacy Permission অনুযায়ী যোগাযোগ তথ্য দেখানো হচ্ছে।</p><div class="actions">${m.allow_call&&m.mobile?`<a class="call" href="tel:${esc(m.mobile)}">📞 Call</a>`:''}${m.allow_whatsapp&&m.whatsapp?`<a class="wa" href="https://wa.me/${esc(m.whatsapp.replace(/\D/g,''))}">💬 WhatsApp</a>`:''}</div></article>`).join(''):'<div class="empty">কোনো সদস্য পাওয়া যায়নি।'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
