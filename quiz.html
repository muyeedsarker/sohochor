<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b27"><title>কুইজ — SOHOCHOR</title><style>:root{--deep:#063b27;--green:#087a4a;--gold:#d8ad38;--ink:#12392b;--muted:#687a71;--line:#dbe9e1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4faf7,#fff 45%,#f6faf8);min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#063b27;color:#fff;box-shadow:0 6px 20px #001b1028}.nav{max-width:900px;margin:auto;height:62px;padding:0 16px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;font-size:18px;margin-right:auto}.back{color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:9px 13px;font-weight:800;background:#ffffff10}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.hero{text-align:center;padding:22px 10px}.hero .icon{font-size:55px}.hero h1{margin:5px 0;font-size:32px;color:var(--deep)}.hero p{margin:6px 0;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 30px #173d2c12}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid var(--line);background:#f4faf7;border-radius:999px;padding:9px 13px;font-weight:800;color:var(--ink);cursor:pointer}.filter.active{background:#087a4a;color:#fff;border-color:#087a4a}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:14px}.progress{height:8px;background:#e7f0eb;border-radius:99px;overflow:hidden;margin-bottom:20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#087a4a,#d8ad38);transition:.25s}.q{font-size:21px;font-weight:900;line-height:1.55;margin-bottom:16px}.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 10px #173d2c08}.answer:hover{transform:translateY(-2px)}.answer.correct{background:#e7f8ee;border-color:#15965d}.answer.wrong{background:#fff0f0;border-color:#d75b5b}.answer:disabled{cursor:default}.feedback{min-height:25px;margin:14px 0 5px;font-weight:900}.next,.restart{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(145deg,#19a86a,#075b3a);color:#fff;font-weight:950;font-size:16px;cursor:pointer;margin-top:10px}.result{text-align:center}.result .score{font-size:48px;font-weight:950;color:#087a4a}.result p{color:var(--muted);line-height:1.7}.hidden{display:none}.share{margin-top:9px;background:#f1f8f4;color:#075d3b;border:1px solid var(--line)}@media(max-width:520px){.hero h1{font-size:28px}.panel{padding:15px}.q{font-size:18px}.answer{padding:12px}} </style></head><body><header class="top"><div class="nav"><div class="brand">🧠 SOHOCHOR • কুইজ</div><a class="back" href="./index.html">← হোম</a></div></header><main class="wrap"><section class="hero"><div class="icon">🧠</div><h1>জ্ঞান যাচাই কুইজ</h1><p>দ্বীন, কুরআন-হাদিস ও সাধারণ জ্ঞান—শিখুন, উত্তর দিন, স্কোর দেখুন।</p></section><section class="panel"><div class="filters" id="filters"><button class="filter active" data-cat="all">সব</button><button class="filter" data-cat="দ্বীন">🕌 দ্বীন</button><button class="filter" data-cat="কুরআন">📖 কুরআন</button><button class="filter" data-cat="সাধারণ জ্ঞান">🌍 সাধারণ জ্ঞান</button></div><div id="quiz"><div class="meta"><span id="count">প্রশ্ন ১/১০</span><span id="score">স্কোর: ০</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next hidden" id="next">পরের প্রশ্ন →</button></div><div class="result hidden" id="result"><div>🎉 কুইজ সম্পন্ন!</div><div class="score" id="finalScore"></div><p id="message"></p><button class="restart" id="restart">🔄 আবার খেলুন</button><button class="restart share" id="share">📤 ফলাফল শেয়ার করুন</button></div></section></main><script>const BANK=[
{c:'দ্বীন',q:'ইসলামের পাঁচটি স্তম্ভের প্রথমটি কোনটি?',a:['সালাত','কালিমা/শাহাদাত','যাকাত','হজ'],x:1},
{c:'দ্বীন',q:'প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',a:['৩','৪','৫','৬'],x:2},
{c:'দ্বীন',q:'রমজান মাসে কোন ইবাদতটি ফরজ?',a:['কুরবানি','সাওম/রোজা','ইতিকাফ','তাহাজ্জুদ'],x:1},
{c:'দ্বীন',q:'যাকাত ইসলামের কত নম্বর স্তম্ভ?',a:['প্রথম','দ্বিতীয়','তৃতীয়','পঞ্চম'],x:2},
{c:'দ্বীন',q:'হজ কোন শহরে আদায় করা হয়?',a:['মদিনা','মক্কা','জেরুজালেম','কায়রো'],x:1},
{c:'কুরআন',q:'পবিত্র কুরআনে মোট কতটি সূরা আছে?',a:['১১০','১১২','১১৪','১১৬'],x:2},
{c:'কুরআন',q:'কুরআনের প্রথম সূরা কোনটি?',a:['আল-বাকারা','আল-ফাতিহা','আল-ইখলাস','আন-নাস'],x:1},
{c:'কুরআন',q:'কুরআনের সবচেয়ে দীর্ঘ সূরা কোনটি?',a:['আল-বাকারা','আলে ইমরান','আন-নিসা','আল-মায়িদা'],x:0},
{c:'কুরআন',q:'সূরা ইখলাসে কয়টি আয়াত?',a:['৩','৪','৫','৬'],x:1},
{c:'কুরআন',q:'কুরআন কোন ভাষায় নাজিল হয়েছে?',a:['ফারসি','উর্দু','আরবি','হিব্রু'],x:2},
{c:'সাধারণ জ্ঞান',q:'বাংলাদেশের রাজধানী কোনটি?',a:['চট্টগ্রাম','রাজশাহী','ঢাকা','সিলেট'],x:2},
{c:'সাধারণ জ্ঞান',q:'বাংলাদেশের জাতীয় মসজিদের নাম কী?',a:['বায়তুল মোকাররম','ষাট গম্বুজ মসজিদ','চকবাজার মসজিদ','সাত গম্বুজ মসজিদ'],x:0},
{c:'সাধারণ জ্ঞান',q:'বাংলাদেশের জাতীয় ফুল কোনটি?',a:['গোলাপ','শাপলা','জবা','বেলি'],x:1},
{c:'সাধারণ জ্ঞান',q:'পৃথিবীর বৃহত্তম মহাসাগর কোনটি?',a:['আটলান্টিক','ভারত','প্রশান্ত','আর্কটিক'],x:2},
{c:'সাধারণ জ্ঞান',q:'বাংলাদেশের মুদ্রার নাম কী?',a:['রুপি','টাকা','রিয়াল','দিনার'],x:1}
];let list=[],i=0,score=0,answered=false;const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);function start(cat='all'){list=(cat==='all'?[...BANK]:BANK.filter(v=>v.c===cat)).sort(()=>Math.random()-.5).slice(0,10);i=0;score=0;document.getElementById('quiz').classList.remove('hidden');document.getElementById('result').classList.add('hidden');render()}function render(){answered=false;const v=list[i];document.getElementById('count').textContent=`প্রশ্ন ${bn(i+1)}/${bn(list.length)}`;document.getElementById('score').textContent=`স্কোর: ${bn(score)}`;document.getElementById('bar').style.width=`${i/list.length*100}%`;document.getElementById('question').textContent=v.q;document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');const box=document.getElementById('answers');box.innerHTML='';v.a.forEach((t,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${'অআইঈ'[n]||String.fromCharCode(0x0995+n)}. ${t}`;b.onclick=()=>answer(b,n);box.appendChild(b)})}function answer(btn,n){if(answered)return;answered=true;const v=list[i];document.querySelectorAll('.answer').forEach((b,k)=>{b.disabled=true;if(k===v.x)b.classList.add('correct')});if(n===v.x){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✅ সঠিক উত্তর!'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent=`❌ ভুল উত্তর। সঠিক উত্তর: ${v.a[v.x]}`}document.getElementById('score').textContent=`স্কোর: ${bn(score)}`;document.getElementById('next').classList.remove('hidden');document.getElementById('bar').style.width=`${(i+1)/list.length*100}%`}document.getElementById('next').onclick=()=>{if(i<list.length-1){i++;render()}else finish()};function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=`${bn(score)} / ${bn(list.length)}`;let p=score/list.length;if(p===1)document.getElementById('message').textContent='মাশাআল্লাহ! অসাধারণ ফলাফল।';else if(p>=.7)document.getElementById('message').textContent='দারুণ! আরও একটু চর্চা করলে পূর্ণ নম্বর সম্ভব।';else document.getElementById('message').textContent='চেষ্টা চালিয়ে যান—জ্ঞান বাড়ানোর সবচেয়ে ভালো উপায় নিয়মিত শেখা।'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');start(b.dataset.cat)});document.getElementById('restart').onclick=()=>start(document.querySelector('.filter.active').dataset.cat);document.getElementById('share').onclick=async()=>{const text=`SOHOCHOR কুইজে আমার স্কোর ${score}/${list.length} 🧠`;try{if(navigator.share)await navigator.share({title:'SOHOCHOR কুইজ',text});else await navigator.clipboard.writeText(text);alert(navigator.share?'':'ফলাফল কপি হয়েছে।')}catch(e){}};start();</script></body></html>
