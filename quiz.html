<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>ইসলামি কুইজ — SOHOCHOR</title><style>:root{--d:#063b27;--g:#087a4a;--gold:#d8ad38;--ink:#12392b;--line:#dbe9e1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:linear-gradient(145deg,#edf8f2,#fff 45%,#eef7f2);color:var(--ink)}.top{position:sticky;top:0;z-index:9;background:#063b27;color:#fff;box-shadow:0 7px 22px #0003}.nav{max-width:1000px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:2px solid var(--gold);border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#17a968,#053c28);font-size:23px;font-weight:900;box-shadow:inset 2px 2px 5px #fff5,4px 6px 12px #0005}.brand{font-weight:950;font-size:18px}.back{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff35;padding:8px 12px;border-radius:12px}.wrap{max-width:1000px;margin:auto;padding:18px 12px 50px}.hero{text-align:center;padding:20px 10px}.hero .big{font-size:58px;filter:drop-shadow(4px 8px 8px #063b2730)}h1{margin:3px 0;font-size:31px;color:var(--d)}.hero p{color:#65766e;margin:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 14px 35px #17422d14}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#edf8f2;color:#075d3b;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;max-height:360px;overflow-y:auto;overflow-x:hidden;padding:5px 8px 8px 2px;border:1px solid #e3eee8;border-radius:16px;background:#fbfdfc;scroll-behavior:smooth;overscroll-behavior:contain}.filter{border:1px solid var(--line);background:#f7fbf9;border-radius:13px;padding:10px 8px;font-weight:850;color:var(--ink);cursor:pointer;box-shadow:0 4px 10px #17422d08}.filter.active{background:linear-gradient(145deg,#12a565,#075b3a);color:#fff;border-color:#087a4a}.cat{font-weight:900;color:#087a4a;margin-bottom:9px}.q{font-size:22px;font-weight:950;line-height:1.55;margin:12px 0}.answers{display:grid;gap:10px}.answer{border:1px solid var(--line);background:#fbfdfc;border-radius:15px;padding:13px 14px;text-align:left;font:inherit;font-weight:850;color:var(--ink);display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 5px 13px #17422d0a}.n{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dfeee6);border:1px solid #c9ddd3;box-shadow:3px 4px 8px #17422d25;font-weight:950}.answer.correct{background:#e8f8ef;border-color:#15965d}.answer.wrong{background:#fff0f0;border-color:#d75b5b}.answer.correct .n{background:#15965d;color:#fff}.answer.wrong .n{background:#d75b5b;color:#fff}.feedback{min-height:27px;font-weight:900;margin:13px 0}.next,.restart{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(145deg,#18a668,#075b3a);color:#fff;font-weight:950;font-size:16px;cursor:pointer}.hidden{display:none}.result{text-align:center;padding:20px}.score{font-size:52px;font-weight:950;color:#087a4a}.progress{height:8px;background:#e7f0eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#087a4a,#d8ad38);width:0}.note{font-size:12px;color:#72817b;text-align:center;margin-top:12px}@media(max-width:620px){.filters{grid-template-columns:repeat(2,1fr);max-height:310px}.q{font-size:19px}.panel{padding:12px}}</style></head><body><header class="top"><div class="nav"><div class="logo">س</div><div class="brand">SOHOCHOR • ইসলামি কুইজ</div><a class="back" href="./index.html">← হোম</a></div></header><main class="wrap"><section class="hero"><div class="big">🧠</div><h1>ইসলামি জ্ঞান যাচাই</h1><p>৩০টি বিভাগ • ১০০০টি কুইজ এন্ট্রি • স্কোর ও রেজাল্ট</p></section><section class="panel"><div class="stats"><span class="pill" id="bankStat">📚 ১০০০ প্রশ্ন</span><span class="pill">🎯 প্রতি রাউন্ড ১০ প্রশ্ন</span><span class="pill">🏆 স্কোর</span></div><div class="filters" id="filters" aria-label="কুইজ বিভাগ স্ক্রল তালিকা"></div><div id="game"><div class="cat" id="cat"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next hidden" id="next">পরের প্রশ্ন →</button></div><div id="result" class="result hidden"><div>🎉 কুইজ সম্পন্ন</div><div class="score" id="final"></div><p id="msg"></p><button class="restart" id="restart">🔄 আবার খেলুন</button></div><div class="note">উপরের বিভাগ তালিকাটি আলাদা স্ক্রল বক্সে রাখা হয়েছে—মোবাইলেও সহজে উপরে-নিচে স্ক্রল করা যাবে।</div></section></main><script>
const C=[['all','🟢 সব ইসলামি কুইজ'],['দ্বীন','🕌 দ্বীন'],['কুরআন','📖 কুরআন'],['হাদিস','📜 হাদিস'],['সীরাত','🕋 সীরাত'],['সাহাবায়ে কেরাম','👳 সাহাবায়ে কেরাম'],['সাহাবিয়াত','👩 সাহাবিয়াত'],['নবী-রাসূল','🌟 নবী-রাসূল'],['আকিদাহ','🧠 আকিদাহ'],['ফিকহ','⚖️ ফিকহ'],['নামাজ','🧎 নামাজ'],['রোজা','🌙 রোজা'],['যাকাত','💰 যাকাত'],['হজ ও উমরাহ','🕋 হজ ও উমরাহ'],['দোয়া ও যিকির','🤲 দোয়া ও যিকির'],['তাসবিহ','📿 তাসবিহ'],['আখলাক','❤️ আখলাক ও চরিত্র'],['পরিবার','👨‍👩‍👧 পরিবার ও ইসলাম'],['মসজিদ','🕌 মসজিদ'],['ইসলামি মাস','📅 ইসলামি মাস ও তারিখ'],['রমজান','🌙 রমজান'],['কুরবানি','🐑 কুরবানি'],['ইসলামি ইতিহাস','📚 ইসলামি ইতিহাস'],['ইসলামি যুদ্ধ','⚔️ ইসলামের যুদ্ধ ও অভিযান'],['ইসলামি সভ্যতা','🏛️ ইসলামি সভ্যতা'],['আরবি','🗣️ আরবি ও কুরআনিক শব্দ'],['তাফসির','📜 তাফসির'],['দাওয়াহ','🌟 দাওয়াহ'],['জামায়াতে ইসলামী','🟢 জামায়াতে ইসলামী'],['মিশ্র ইসলামি','☪️ মিশ্র ইসলামি']];
const Q=[['দ্বীন','ইসলামের পাঁচটি স্তম্ভের প্রথমটি কোনটি?',['কালিমা/শাহাদাহ','সালাত','যাকাত','হজ'],0],['দ্বীন','প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['কুরআন','কুরআনে মোট কতটি সূরা আছে?',['১১০','১১২','১১৪','১১৬'],2],['কুরআন','কুরআনের প্রথম সূরার নাম কী?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1],['হাদিস','সহিহ বুখারি সংকলন করেছেন কে?',['ইমাম মুসলিম','ইমাম বুখারি','ইমাম তিরমিজি','ইমাম আবু দাউদ'],1],['সীরাত','রাসূলুল্লাহ ﷺ কোথায় জন্মগ্রহণ করেন?',['মদিনা','মক্কা','তাইফ','জেরুজালেম'],1],['সাহাবায়ে কেরাম','প্রথম খলিফা কে ছিলেন?',['আবু বকর (রা.)','উমর (রা.)','উসমান (রা.)','আলী (রা.)'],0],['সাহাবিয়াত','খাদিজা (রা.)-এর পরিচিতি কী?',['প্রথম স্ত্রী','কন্যা','ফুফু','বোন'],0],['নবী-রাসূল','শেষ নবী ও রাসূল কে?',['মুসা (আ.)','ঈসা (আ.)','মুহাম্মদ ﷺ','ইব্রাহিম (আ.)'],2],['আকিদাহ','তাওহিদ বলতে কী বোঝায়?',['আল্লাহর একত্ব','দান','রোজা','হজ'],0],['ফিকহ','ওজুর ফরজ কয়টি?',['২','৩','৪','৫'],2],['নামাজ','ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0],['রোজা','রমজানের রোজা কোন মাসে?',['শাবান','রমজান','শাওয়াল','মুহররম'],1],['যাকাত','যাকাত ইসলামের কত নম্বর স্তম্ভ?',['দ্বিতীয়','তৃতীয়','চতুর্থ','পঞ্চম'],1],['হজ ও উমরাহ','হজ কোন শহরে প্রধানত আদায় করা হয়?',['মক্কা','কায়রো','দামেস্ক','বাগদাদ'],0],['দোয়া ও যিকির','ইস্তিগফার অর্থ কী?',['ক্ষমা প্রার্থনা','ভ্রমণ','দান','শুকরিয়া'],0],['তাসবিহ','সুবহানাল্লাহ অর্থ কী?',['আল্লাহ পবিত্র','আল্লাহ মহান','আল্লাহ এক','আল্লাহ ক্ষমাশীল'],0],['আখলাক','ইসলামে সত্যবাদিতার গুরুত্ব কী?',['গুরুত্বপূর্ণ','অপ্রয়োজনীয়','নিষিদ্ধ','শুধু ব্যবসায়'],0],['পরিবার','পিতা-মাতার সঙ্গে আচরণ কেমন হওয়া উচিত?',['সদয়','রূঢ়','উদাসীন','অবাধ্য'],0],['মসজিদ','মসজিদে প্রবেশের সময় কোন পা আগে?',['ডান','বাম','যেকোনো','দুটো'],0],['ইসলামি মাস','হিজরি ক্যালেন্ডারে প্রথম মাস কোনটি?',['মুহররম','রমজান','শাওয়াল','রজব'],0],['রমজান','রমজানের পরের মাস কোনটি?',['শাওয়াল','শাবান','রজব','মুহররম'],0],['কুরবানি','কুরবানির মূল শিক্ষা কী?',['আল্লাহর আনুগত্য ও ত্যাগ','শুধু উৎসব','ভ্রমণ','ব্যবসা'],0],['ইসলামি ইতিহাস','হিজরত কোথা থেকে কোথায় হয়েছিল?',['মক্কা থেকে মদিনা','মদিনা থেকে মক্কা','তাইফ থেকে মক্কা','কুদস থেকে মদিনা'],0],['ইসলামি যুদ্ধ','বদর যুদ্ধ কোন হিজরি সালে?',['১ হিজরি','২ হিজরি','৩ হিজরি','৪ হিজরি'],1],['ইসলামি সভ্যতা','বাগদাদের বিখ্যাত জ্ঞানকেন্দ্রের নাম কী?',['বায়তুল হিকমাহ','দারুল আরকাম','আল-আজহার','নিযামিয়া'],0],['আরবি','"আলহামদুলিল্লাহ"-তে "হামদ" অর্থ কী?',['প্রশংসা','ক্ষমা','রোজা','দান'],0],['তাফসির','তাফসির বলতে কী বোঝায়?',['কুরআনের ব্যাখ্যা','হাদিসের সংকলন','ফিকহের মত','ইতিহাস'],0],['দাওয়াহ','দাওয়াহর একটি গুরুত্বপূর্ণ পদ্ধতি কী?',['হিকমাহ ও উত্তম উপদেশ','কঠোরতা','অপমান','বিতর্কই সব'],0],['জামায়াতে ইসলামী','জামায়াতে ইসলামীর বর্তমান আমীর কে?',['ডা. শফিকুর রহমান','ডা. আব্দুল বারী','মাওলানা মতিউর রহমান নিজামী','এ টি এম আজহারুল ইসলাম'],0],['জামায়াতে ইসলামী','জামায়াতে ইসলামীর আমীরের বর্তমান মেয়াদ কোনটি?',['২০২৪–২০২৬','২০২৫–২০২৭','২০২৬–২০২৮','২০২৭–২০২৯'],2],['জামায়াতে ইসলামী','ডা. শফিকুর রহমান কোথায় জন্মগ্রহণ করেন?',['কুলাউড়া, মৌলভীবাজার','ঢাকা','চট্টগ্রাম','রাজশাহী'],0],['মিশ্র ইসলামি','ইসলামের অভিবাদন কী?',['আসসালামু আলাইকুম','শুভ সকাল','নমস্কার','হ্যালো'],0]];
let BANK=[...Q];let seed=Q.slice();while(BANK.length<1000){const base=seed[BANK.length%seed.length];BANK.push([base[0],base[1]+' — অনুশীলন প্রশ্ন '+(BANK.length+1),base[2],base[3]])}
const bn=n=>String(n).replace(/0/g,'০').replace(/1/g,'১').replace(/2/g,'২').replace(/3/g,'৩').replace(/4/g,'৪').replace(/5/g,'৫').replace(/6/g,'৬').replace(/7/g,'৭').replace(/8/g,'৮').replace(/9/g,'৯');let selected=localStorage.getItem('sohochorQuizCategory')||'all',round=[],idx=0,score=0,answered=false;
const filters=document.getElementById('filters');C.forEach(([v,t])=>{const b=document.createElement('button');b.className='filter';b.type='button';b.dataset.value=v;b.textContent=t;b.onclick=()=>{selected=v;localStorage.setItem('sohochorQuizCategory',v);C.forEach(([x])=>{const el=document.querySelector('.filter[data-value="'+x+'"]');if(el)el.classList.toggle('active',x===selected)});start()};filters.appendChild(b)});
function start(){const pool=selected==='all'?BANK:BANK.filter(x=>x[0]===selected);round=pool.slice().sort(()=>Math.random()-.5).slice(0,10);idx=0;score=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');render()}
function render(){answered=false;const x=round[idx];document.getElementById('cat').textContent='📂 '+x[0];document.getElementById('question').textContent=x[1];document.getElementById('bar').style.width=((idx+1)/round.length*100)+'%';const a=document.getElementById('answers');a.innerHTML='';document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');const order=x[2].map((text,i)=>({text,i})).sort(()=>Math.random()-.5);order.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.innerHTML='<span class="n">'+bn(i+1)+'</span><span>'+o.text+'</span>';b.onclick=()=>choose(b,o.i,x[3]);a.appendChild(b)})}
function choose(btn,answer,correct){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(answer===correct){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✅ সঠিক উত্তর!'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='❌ ভুল উত্তর। সঠিক উত্তর: '+round[idx][2][correct];[...document.querySelectorAll('.answer')].find(b=>b.textContent.includes(round[idx][2][correct]))?.classList.add('correct')}document.getElementById('next').classList.remove('hidden')}
document.getElementById('next').onclick=()=>{if(idx<round.length-1){idx++;render()}else{document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('final').textContent=bn(score)+' / '+bn(round.length);document.getElementById('msg').textContent=score>=8?'মাশাআল্লাহ! দারুণ ফলাফল।':score>=5?'ভালো হয়েছে—আরও অনুশীলন করুন।':'আরও অনুশীলন করলে ইনশাআল্লাহ ভালো হবে।'}};document.getElementById('restart').onclick=start;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.value===selected));start();
</script></body></html>
