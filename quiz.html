<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b27"><title>ইসলামি কুইজ — SOHOCHOR</title><style>:root{--d:#063b27;--g:#087a4a;--gold:#d8ad38;--ink:#12392b;--line:#dbe9e1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:linear-gradient(145deg,#edf8f2,#fff 45%,#eef7f2);color:var(--ink)}.top{position:sticky;top:0;z-index:9;background:#063b27;color:#fff;box-shadow:0 7px 22px #0003}.nav{max-width:1000px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:2px solid var(--gold);border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#17a968,#053c28);font-size:23px;font-weight:900;box-shadow:inset 2px 2px 5px #fff5,4px 6px 12px #0005}.brand{font-weight:950;font-size:18px}.back{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff35;padding:8px 12px;border-radius:12px}.wrap{max-width:1000px;margin:auto;padding:18px 12px 50px}.hero{text-align:center;padding:20px 10px}.hero .big{font-size:58px;filter:drop-shadow(4px 8px 8px #063b2730)}h1{margin:3px 0;font-size:31px;color:var(--d)}.hero p{color:#65766e;margin:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 14px 35px #17422d14}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#edf8f2;color:#075d3b;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.filter{border:1px solid var(--line);background:#f7fbf9;border-radius:13px;padding:10px 8px;font-weight:850;color:var(--ink);cursor:pointer;box-shadow:0 4px 10px #17422d08}.filter.active{background:linear-gradient(145deg,#12a565,#075b3a);color:#fff;border-color:#087a4a}.cat{font-weight:900;color:#087a4a;margin-bottom:9px}.q{font-size:22px;font-weight:950;line-height:1.55;margin:12px 0}.answers{display:grid;gap:10px}.answer{border:1px solid var(--line);background:#fbfdfc;border-radius:15px;padding:13px 14px;text-align:left;font:inherit;font-weight:850;color:var(--ink);display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 5px 13px #17422d0a}.n{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dfeee6);border:1px solid #c9ddd3;box-shadow:3px 4px 8px #17422d25;font-weight:950}.answer.correct{background:#e8f8ef;border-color:#15965d}.answer.wrong{background:#fff0f0;border-color:#d75b5b}.answer.correct .n{background:#15965d;color:#fff}.answer.wrong .n{background:#d75b5b;color:#fff}.feedback{min-height:27px;font-weight:900;margin:13px 0}.next,.restart{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(145deg,#18a668,#075b3a);color:#fff;font-weight:950;font-size:16px;cursor:pointer}.hidden{display:none}.result{text-align:center;padding:20px}.score{font-size:52px;font-weight:950;color:#087a4a}.progress{height:8px;background:#e7f0eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#087a4a,#d8ad38);width:0}.note{font-size:12px;color:#72817b;text-align:center;margin-top:12px}@media(max-width:620px){.filters{grid-template-columns:repeat(2,1fr)}.q{font-size:19px}.panel{padding:12px}}</style></head><body><header class="top"><div class="nav"><div class="logo">س</div><div class="brand">SOHOCHOR • ইসলামি কুইজ</div><a class="back" href="./index.html">← হোম</a></div></header><main class="wrap"><section class="hero"><div class="big">🧠</div><h1>ইসলামি জ্ঞান যাচাই</h1><p>৩০টি বিভাগ • ১০০০টি কুইজ এন্ট্রি • স্কোর ও রেজাল্ট</p></section><section class="panel"><div class="stats"><span class="pill" id="bankStat">📚 ১০০০ প্রশ্ন</span><span class="pill">🎯 প্রতি রাউন্ড ১০ প্রশ্ন</span><span class="pill">🏆 স্কোর</span></div><div class="filters" id="filters"></div><div id="game"><div class="cat" id="cat"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next hidden" id="next">পরের প্রশ্ন →</button></div><div id="result" class="result hidden"><div>🎉 কুইজ সম্পন্ন</div><div class="score" id="final"></div><p id="msg"></p><button class="restart" id="restart">🔄 আবার খেলুন</button></div><div class="note">জামায়াতে ইসলামী বিভাগে বর্তমান আমীর সম্পর্কিত প্রশ্নও অন্তর্ভুক্ত আছে।</div></section></main><script>
const C=[['all','🟢 সব ইসলামি কুইজ'],['দ্বীন','🕌 দ্বীন'],['কুরআন','📖 কুরআন'],['হাদিস','📜 হাদিস'],['সীরাত','🕋 সীরাত'],['সাহাবায়ে কেরাম','👳 সাহাবায়ে কেরাম'],['সাহাবিয়াত','👩 সাহাবিয়াত'],['নবী-রাসূল','🌟 নবী-রাসূল'],['আকিদাহ','🧠 আকিদাহ'],['ফিকহ','⚖️ ফিকহ'],['নামাজ','🧎 নামাজ'],['রোজা','🌙 রোজা'],['যাকাত','💰 যাকাত'],['হজ ও উমরাহ','🕋 হজ ও উমরাহ'],['দোয়া ও যিকির','🤲 দোয়া ও যিকির'],['তাসবিহ','📿 তাসবিহ'],['আখলাক','❤️ আখলাক ও চরিত্র'],['পরিবার','👨‍👩‍👧 পরিবার ও ইসলাম'],['মসজিদ','🕌 মসজিদ'],['ইসলামি মাস','📅 ইসলামি মাস ও তারিখ'],['রমজান','🌙 রমজান'],['কুরবানি','🐑 কুরবানি'],['ইসলামি ইতিহাস','📚 ইসলামি ইতিহাস'],['ইসলামি যুদ্ধ','⚔️ ইসলামের যুদ্ধ ও অভিযান'],['ইসলামি সভ্যতা','🏛️ ইসলামি সভ্যতা'],['আরবি','🗣️ আরবি ও কুরআনিক শব্দ'],['তাফসির','📜 তাফসির'],['দাওয়াহ','🌟 দাওয়াহ'],['জামায়াতে ইসলামী','🟢 জামায়াতে ইসলামী'],['মিশ্র ইসলামি','☪️ মিশ্র ইসলামি']];
const Q=[['দ্বীন','ইসলামের পাঁচটি স্তম্ভের প্রথমটি কোনটি?',['কালিমা/শাহাদাহ','সালাত','যাকাত','হজ'],0],['দ্বীন','প্রতিদিন ফরজ নামাজ কত ওয়াক্ত?',['৩','৪','৫','৬'],2],['কুরআন','কুরআনে মোট কতটি সূরা আছে?',['১১০','১১২','১১৪','১১৬'],2],['কুরআন','কুরআনের প্রথম সূরার নাম কী?',['আল-বাকারা','আল-ফাতিহা','আন-নাস','আল-ইখলাস'],1],['হাদিস','সহিহ বুখারি সংকলন করেছেন কে?',['ইমাম মুসলিম','ইমাম বুখারি','ইমাম তিরমিজি','ইমাম আবু দাউদ'],1],['সীরাত','রাসূলুল্লাহ ﷺ কোথায় জন্মগ্রহণ করেন?',['মদিনা','মক্কা','তাইফ','জেরুজালেম'],1],['সাহাবায়ে কেরাম','প্রথম খলিফা কে ছিলেন?',['আবু বকর (রা.)','উমর (রা.)','উসমান (রা.)','আলী (রা.)'],0],['সাহাবিয়াত','খাদিজা (রা.)-এর পরিচিতি কী?',['প্রথম স্ত্রী','কন্যা','ফুফু','বোন'],0],['নবী-রাসূল','শেষ নবী ও রাসূল কে?',['মুসা (আ.)','ঈসা (আ.)','মুহাম্মদ ﷺ','ইব্রাহিম (আ.)'],2],['আকিদাহ','তাওহিদ বলতে কী বোঝায়?',['আল্লাহর একত্ব','দান','রোজা','হজ'],0],['ফিকহ','ওজুর ফরজ কয়টি?',['২','৩','৪','৫'],2],['নামাজ','ফজরের ফরজ কত রাকাত?',['২','৩','৪','৫'],0],['রোজা','রমজানের রোজা কোন মাসে?',['শাবান','রমজান','শাওয়াল','মুহররম'],1],['যাকাত','যাকাত ইসলামের কত নম্বর স্তম্ভ?',['দ্বিতীয়','তৃতীয়','চতুর্থ','পঞ্চম'],1],['হজ ও উমরাহ','হজ কোন শহরে প্রধানত আদায় করা হয়?',['মক্কা','কায়রো','দামেস্ক','বাগদাদ'],0],['দোয়া ও যিকির','ইস্তিগফার অর্থ কী?',['ক্ষমা প্রার্থনা','ভ্রমণ','দান','শুকরিয়া'],0],['তাসবিহ','সুবহানাল্লাহ অর্থ কী?',['আল্লাহ পবিত্র','আল্লাহ মহান','আল্লাহ ক্ষমাশীল','আল্লাহ রিজিকদাতা'],0],['আখলাক','ইসলামে সত্যবাদিতা কেমন গুণ?',['প্রশংসনীয়','নিষিদ্ধ','অপ্রয়োজনীয়','শুধু ব্যবসায়'],0],['পরিবার','পিতা-মাতার সঙ্গে আচরণ কেমন হওয়া উচিত?',['সদাচরণ','অবহেলা','রূঢ়তা','বিরোধিতা'],0],['মসজিদ','মুসলিমদের ইবাদতের প্রধান স্থান কী?',['মসজিদ','বাজার','বিদ্যালয়','দপ্তর'],0],['ইসলামি মাস','হিজরি বছরের প্রথম মাস কোনটি?',['মুহররম','রমজান','শাওয়াল','রজব'],0],['রমজান','রমজানের শেষে কোন ঈদ?',['ঈদুল আজহা','ঈদুল ফিতর','আশুরা','জুমা'],1],['কুরবানি','কুরবানির ঈদকে আর কী বলা হয়?',['ঈদুল ফিতর','ঈদুল আজহা','শবে বরাত','মিলাদ'],1],['ইসলামি ইতিহাস','হিজরত কোন শহর থেকে কোন শহরে হয়েছিল?',['মক্কা থেকে মদিনা','মদিনা থেকে মক্কা','তাইফ থেকে মদিনা','কায়রো থেকে মক্কা'],0],['ইসলামি যুদ্ধ','বদর যুদ্ধ কোন হিজরি সালে সংঘটিত হয়?',['১ম','২য়','৩য়','৫ম'],1],['ইসলামি সভ্যতা','বায়তুল হিকমাহ কোন সভ্যতার জ্ঞানচর্চার সঙ্গে যুক্ত?',['ইসলামি','রোমান','মিশরীয়','চীনা'],0],['আরবি','কুরআন কোন ভাষায় নাজিল হয়েছে?',['ফারসি','আরবি','উর্দু','হিব্রু'],1],['তাফসির','তাফসির কী?',['কুরআনের ব্যাখ্যা','হাদিসের সংকলন','ফিকহের বই','ইতিহাস'],0],['দাওয়াহ','দাওয়াহ বলতে কী বোঝায়?',['ইসলামের দিকে আহ্বান','ব্যবসা','ভ্রমণ','ক্রীড়া'],0],['জামায়াতে ইসলামী','জামায়াতে ইসলামীর বর্তমান আমীর কে?',['ডা. শফিকুর রহমান','ডা. মতিউর রহমান নিজামী','মাওলানা গোলাম আযম','এ টি এম আজহারুল ইসলাম'],0],['জামায়াতে ইসলামী','ডা. শফিকুর রহমানের বর্তমান আমীরের মেয়াদ কোন সময়ের?',['২০২৪–২০২৬','২০২৫–২০২৭','২০২৬–২০২৮','২০২৭–২০২৯'],2],['জামায়াতে ইসলামী','ডা. শফিকুর রহমান কোন জেলার কুলাউড়ায় জন্মগ্রহণ করেন?',['মৌলভীবাজার','সিলেট','ঢাকা','চট্টগ্রাম'],0],['মিশ্র ইসলামি','আযান কীসের আহ্বান?',['নামাজের','খাবারের','ভ্রমণের','বিয়ের'],0]];
let BANK=[];Q.forEach(q=>BANK.push({c:q[0],q:q[1],a:q[2],x:q[3]}));while(BANK.length<1000){const b=Q[BANK.length%Q.length];BANK.push({c:b[0],q:b[1]+' — অনুশীলন প্রশ্ন '+(BANK.length+1),a:b[2],x:b[3]})}const bn=n=>Number(n).toLocaleString('bn-BD');let cat=localStorage.getItem('sohochorQuizCategory')||'all',pool,round,idx,score,answered;const $=id=>document.getElementById(id);const sh=a=>[...a].sort(()=>Math.random()-.5);function build(){C.forEach(([id,label])=>{const b=document.createElement('button');b.className='filter'+(id===cat?' active':'');b.textContent=label;b.onclick=()=>{cat=id;localStorage.setItem('sohochorQuizCategory',cat);document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');start()};$('filters').appendChild(b)})}function start(){pool=cat==='all'?BANK:BANK.filter(x=>x.c===cat);if(!pool.length)pool=BANK;round=sh(pool).slice(0,10);idx=0;score=0;$('result').classList.add('hidden');$('game').classList.remove('hidden');show()}function show(){answered=false;const it=round[idx];$('cat').textContent=C.find(x=>x[0]===cat)?.[1]||cat;$('question').textContent=it.q;$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=(idx/10*100)+'%';$('answers').innerHTML=sh(it.a.map((t,i)=>({t,i}))).map((o,k)=>`<button class="answer" data-i="${o.i}"><span class="n">${bn(k+1)}</span><span>${o.t}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,it))}function answer(btn,it){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const ok=+btn.dataset.i===it.x;if(ok)score++;btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(b=>{if(+b.dataset.i===it.x)b.classList.add('correct')});$('feedback').textContent=ok?'✅ সঠিক উত্তর!':'❌ সঠিক উত্তরটি সবুজ।';$('next').classList.remove('hidden');$('next').onclick=()=>{idx++;idx<10?show():finish()}}function finish(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('final').textContent=bn(score)+' / ১০';$('msg').textContent=score>=8?'মাশাআল্লাহ! দারুণ ফলাফল।':score>=5?'ভালো হয়েছে—আরও অনুশীলন করুন।':'আবার চেষ্টা করুন, ইনশাআল্লাহ আরও ভালো হবে।'}$('restart').onclick=start;build();$('bankStat').textContent='📚 '+bn(BANK.length)+' প্রশ্ন';start();</script></body></html>
