<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>SOHOCHOR — ব্যক্তিগত রিপোর্ট</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="theme.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.report{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0002;border-left:6px solid #08783f}.report h3{margin:0 0 8px}.report p{white-space:pre-wrap}.save{background:#08783f;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800}.private{color:#08783f;font-weight:800;font-size:13px}.status{padding:5px 9px;border-radius:999px;background:#eef7f1;font-size:12px}</style></head><body><main class="page"><section class="hero"><div class="hero-kicker">SOHOCHOR — সহচর</div><h1>📊 ব্যক্তিগত রিপোর্ট বই</h1><p>আপনার রিপোর্ট আপনার Account-এর সঙ্গে সংযুক্ত।</p></section><section class="panel"><input id="title" placeholder="রিপোর্টের শিরোনাম" style="width:100%;box-sizing:border-box;padding:12px;border:2px solid #b7d9c8;border-radius:12px"><input id="date" type="date" style="margin-top:10px;padding:11px;border:2px solid #b7d9c8;border-radius:12px"><textarea id="content" rows="7" placeholder="আজকের রিপোর্ট লিখুন..." style="width:100%;box-sizing:border-box;margin-top:10px;padding:12px;border:2px solid #b7d9c8;border-radius:12px"></textarea><button class="save" onclick="saveReport()" style="margin-top:10px">💾 রিপোর্ট সংরক্ষণ</button><p id="msg"></p></section><section><h2>আমার রিপোর্ট</h2><div id="reports"></div></section><p><a href="personal.html">👤 Personal Space</a> · <a href="index.html">🏠 Home</a></p></main><script>const db=supabase.createClient('https://pgwxfccpphjjveoeeqhv.supabase.co','sb_publishable_Hi2YfMYdGfGS3al-ojQA9A_6wPEG2ym');let user=null;const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function init(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.href='auth.html';return}user=data.session.user;document.getElementById('date').value=new Date().toISOString().slice(0,10);load()}async function load(){const {data,error}=await db.from('personal_reports').select('*').eq('member_id',user.id).order('report_date',{ascending:false}).order('updated_at',{ascending:false});if(error){document.getElementById('msg').textContent='Supabase-এ supabase/reports.sql একবার Run করুন।';return}document.getElementById('reports').innerHTML=data.length?data.map(r=>`<article class="report"><h3>${esc(r.title)}</h3><small>${esc(r.report_date)} · <span class="status">${esc(r.status)}</span></small><p>${esc(r.content)}</p><div class="private">🔒 ব্যক্তিগত রিপোর্ট</div></article>`).join(''):'<p>এখনো কোনো রিপোর্ট নেই।</p>'}async function saveReport(){const title=document.getElementById('title').value.trim()||'ব্যক্তিগত রিপোর্ট',content=document.getElementById('content').value.trim(),report_date=document.getElementById('date').value;if(!content){document.getElementById('msg').textContent='রিপোর্টের লেখা দিন।';return}const {error}=await db.from('personal_reports').insert({member_id:user.id,title,content,report_date,status:'draft'});if(error){document.getElementById('msg').textContent=error.message;return}document.getElementById('title').value='';document.getElementById('content').value='';document.getElementById('msg').textContent='রিপোর্ট সংরক্ষিত হয়েছে।';load()}init();</script></body></html>
